# One-click deploy on Render (https://render.com) - Blueprint
services:
  - type: web
    name: ewebgen
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python import_templates.py; gunicorn main:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 900
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: EWEBGEN_DB
        value: sqlite
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_DEFAULT_PASS
        value: admin123

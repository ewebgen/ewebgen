<script>
    // --- GLOBAL VARIABLES FOR SPLIT FILES ---
    window.currentContextTarget = null;
    window.currentContextDoc = null;
    window.pendingImageInsert = false;
    window.pendingLogoInsert = false; 
    window.pendingSlideshowAdd = false; 
    window.pendingLinkTarget = window.pendingLinkTarget || null;

    // =========================================================================
    // GOAL 1 FIX: PRECISION CONTEXT-TARGET IMAGE INSERTION ENGINE
    // =========================================================================
    window.insertOrReplaceImage = function(imgUrl, altText = "Website Image") {
        if (!imgUrl) return;
        const iframe = document.getElementById('preview-frame');
        if (!iframe) return;
        const doc = iframe.contentDocument || iframe.contentWindow.document;

        // Resolution Hierarchy: 
        // 1. Right-clicked element captured via Context Menu
        // 2. Currently active/selected image widget inside the iframe
        // 3. Last valid highlighted text selection range
        // 4. Currently active parent section
        let targetEl = window.currentContextTarget || doc.querySelector('.image-wrapper-editable.active, img.eweb-selected-img');

        if (targetEl && doc.contains(targetEl)) {
            if (targetEl.tagName.toLowerCase() === 'img') {
                targetEl.src = imgUrl;
                targetEl.alt = altText;
            } else if (targetEl.classList.contains('image-wrapper-editable') || targetEl.classList.contains('eweb-image-widget')) {
                const img = targetEl.querySelector('img');
                if (img) {
                    img.src = imgUrl;
                    img.alt = altText;
                } else {
                    targetEl.innerHTML = `<img src="${imgUrl}" alt="${altText}" style="max-width:100%; height:auto;" class="img-fluid">`;
                }
            } else {
                // Wrap standard structural elements safely
                const wrapper = doc.createElement('div');
                wrapper.className = 'image-wrapper-editable reformatted';
                wrapper.style.cssText = 'position:relative; display:inline-block; max-width:100%; margin:10px 0;';
                wrapper.innerHTML = `<img src="${imgUrl}" alt="${altText}" style="max-width:100%; height:auto;" class="img-fluid">`;

                if (['p', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'span', 'li', 'td', 'th', 'blockquote', 'a', 'b', 'strong', 'i'].includes(targetEl.tagName.toLowerCase())) {
                    targetEl.insertAdjacentElement('afterend', wrapper);
                } else {
                    targetEl.appendChild(wrapper);
                }
            }
            // Clear context target post-insert so standard toolbar clicks don't stick to it
            window.currentContextTarget = null;
        } else if (window.lastValidRange) {
            const range = window.lastValidRange;
            const wrapper = doc.createElement('div');
            wrapper.className = 'image-wrapper-editable reformatted';
            wrapper.style.cssText = 'position:relative; display:inline-block; max-width:100%; margin:10px 0;';
            wrapper.innerHTML = `<img src="${imgUrl}" alt="${altText}" style="max-width:100%; height:auto;" class="img-fluid">`;

            try {
                range.deleteContents();
                range.insertNode(wrapper);
                range.collapse(false);
            } catch(e) {
                doc.body.appendChild(wrapper);
            }
        } else {
            const activeSec = doc.querySelector('section.active, section:hover') || doc.body.querySelector('section') || doc.body;
            const wrapper = doc.createElement('div');
            wrapper.className = 'image-wrapper-editable reformatted';
            wrapper.style.cssText = 'position:relative; display:inline-block; max-width:100%; margin:10px 0;';
            wrapper.innerHTML = `<img src="${imgUrl}" alt="${altText}" style="max-width:100%; height:auto;" class="img-fluid">`;
            activeSec.appendChild(wrapper);
        }

        if (typeof window.initEditor === 'function') window.initEditor(iframe);
        if (typeof window.captureState === 'function') window.captureState();
        if (typeof window.enableSaveButton === 'function') window.enableSaveButton();
        if (typeof window.updateStatus === 'function') window.updateStatus("✅ Image inserted successfully.");
    };

    // Intercept standard image gallery return
    let _cachedImgUrl = null;
    Object.defineProperty(window, 'selectedImageSrc', {
        get: () => _cachedImgUrl,
        set: (url) => {
            _cachedImgUrl = url;
            if (url && (window.currentMediaContext === 'image' || !window.currentMediaContext)) {
                window.insertOrReplaceImage(url);
            }
        }
    });

   // --- RIGHT CLICK MENU FIX & TARGETING IMPROVEMENTS ---
    window.showContextMenu = function(e, element, doc) {
        if (typeof window.closeFormattingToolbar === 'function') {
            window.closeFormattingToolbar();
        }

        let menu = doc.getElementById('custom-context-menu');
        if(!menu) { menu = doc.createElement('div'); menu.id = 'custom-context-menu'; doc.body.appendChild(menu); }
        
        window.currentContextTarget = element;
        window.currentContextDoc = doc;

        const sel = doc.getSelection();
        const hasTextSelection = !sel.isCollapsed && sel.rangeCount > 0 && sel.toString().trim().length > 0;
        
        let targetCarousel = element.closest('.eweb-carousel-container, .eweb-carousel-widget, .carousel');
        let targetVideo = element.closest('.eweb-video-widget, video, iframe, .eweb-video-overlay, .ratio');
        let targetImage = element.closest('img, .image-wrapper-editable, .eweb-image-widget');
        
        if (targetCarousel) targetImage = null; 
        if (targetVideo && targetVideo.classList.contains('eweb-video-overlay')) {
            targetVideo = targetVideo.parentElement.querySelector('video, iframe');
        } else if (targetVideo && targetVideo.classList.contains('ratio')) {
            targetVideo = targetVideo.querySelector('video, iframe');
        }
        
        const isBuyBtn = element.classList.contains('buy-btn');
        let html = ``;

        // 1. CAROUSEL OPTIONS
        if (targetCarousel) {
            html += `<div class="menu-header" style="padding: 5px; font-size: 11px; font-weight: bold; color: #888; background: #f8f9fa; border-bottom: 1px solid #ddd; text-align: center; border-radius: 6px 6px 0 0;">Carousel Options</div>`;
            html += `<div class="context-menu-item" style="padding: 8px 15px; cursor: pointer; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #333;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'" onclick="
                const c = window.parent.currentContextTarget.closest('.eweb-carousel-container, .eweb-carousel-widget, .carousel');
                if(c) {
                    const imgs = Array.from(c.querySelectorAll('img')).map(img => img.src);
                    if(typeof window.parent.openEditCarouselModal === 'function') window.parent.openEditCarouselModal(c, imgs);
                    else if(typeof window.openEditCarouselModal === 'function') window.openEditCarouselModal(c, imgs);
                    else if(typeof openEditCarouselModal === 'function') openEditCarouselModal(c, imgs);
                }
                document.getElementById('custom-context-menu').style.display='none';
            ">🎠 Edit Carousel Images</div>`;
            
            html += `<div class="context-menu-item" style="padding: 8px 15px; cursor: pointer; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #dc3545;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'" onclick="
                if(typeof window.parent.captureState === 'function') window.parent.captureState();
                if(window.parent.confirm('Delete this Carousel?')) { 
                    const c = window.parent.currentContextTarget.closest('.eweb-carousel-container, .eweb-carousel-widget, .carousel');
                    if(c) c.remove(); 
                    if(window.parent.document.getElementById('save-btn')) window.parent.document.getElementById('save-btn').disabled = false; 
                    if(typeof window.parent.captureState === 'function') window.parent.captureState(); 
                }
                document.getElementById('custom-context-menu').style.display='none';
            ">🗑️ Delete Carousel</div>`;
        }
        
        // 2. IMAGE OPTIONS
        else if (targetImage) {
            html += `<div class="menu-header" style="padding: 5px; font-size: 11px; font-weight: bold; color: #888; background: #f8f9fa; border-bottom: 1px solid #ddd; text-align: center; border-radius: 6px 6px 0 0;">Image Options</div>`;
            
            html += `<div class="context-menu-item" style="padding: 8px 15px; cursor: pointer; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #333;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'" onclick="
                const t = window.parent.currentContextTarget.closest('.image-wrapper-editable, .eweb-image-widget, img') || window.parent.currentContextTarget;
                let url = '';
                if(t) {
                    if(t.tagName === 'IMG') url = t.src;
                    else { const img = t.querySelector('img'); if(img) url = img.src; }
                }
                if(typeof window.parent.openEditImageModal === 'function') window.parent.openEditImageModal(t, url);
                else if(typeof window.openEditImageModal === 'function') window.openEditImageModal(t, url);
                else if(typeof openEditImageModal === 'function') openEditImageModal(t, url);
                
                document.getElementById('custom-context-menu').style.display='none';
            ">🖼️ Edit / Change Image</div>`;
            
            html += `<button id="ctx-cut-img" style="display:block; width:100%; text-align:left; padding:8px 15px; background:none; border:none; cursor:pointer; font-size:13px; color:#333; border-bottom:1px solid #eee;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">✂️ Cut Image</button>`;
            html += `<button id="ctx-copy-img" style="display:block; width:100%; text-align:left; padding:8px 15px; background:none; border:none; cursor:pointer; font-size:13px; color:#333; border-bottom:1px solid #eee;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">📋 Copy Image</button>`;
            html += `<button id="ctx-paste-img" style="display:block; width:100%; text-align:left; padding:8px 15px; background:none; border:none; cursor:pointer; font-size:13px; color:#333; border-bottom:1px solid #eee;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">📥 Paste (Replace)</button>`;
            html += `<button id="ctx-add-img" style="display:block; width:100%; text-align:left; padding:8px 15px; background:none; border:none; cursor:pointer; font-size:13px; color:#333; border-bottom:1px solid #eee;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">🖼️ Add New Image</button>`;
            html += `<button id="ctx-unified-link-img" style="display:block; width:100%; text-align:left; padding:8px 15px; background:none; border:none; cursor:pointer; font-size:13px; color:#333; border-bottom:1px solid #eee;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">🔗 Link to URL / Hyperlink</button>`;
            html += `<button id="ctx-del-img" style="display:block; width:100%; text-align:left; padding:8px 15px; background:none; border:none; cursor:pointer; font-size:13px; color:#dc3545; border-bottom:1px solid #eee;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">🗑️ Delete Image</button>`; 
        } 
        
        // 3. VIDEO OPTIONS
        else if (targetVideo) { 
            html += `<div class="menu-header" style="padding: 5px; font-size: 11px; font-weight: bold; color: #888; background: #f8f9fa; border-bottom: 1px solid #ddd; text-align: center; border-radius: 6px 6px 0 0;">Video Options</div>`;
            html += `<div class="context-menu-item" style="padding: 8px 15px; cursor: pointer; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #333;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'" onclick="
                const v = window.parent.currentContextTarget.closest('.eweb-video-widget, .ratio') || window.parent.currentContextTarget;
                let url = '';
                let isYT = false;
                if(v) {
                    const vid = v.querySelector('video');
                    const ifr = v.querySelector('iframe');
                    if(vid) url = vid.src;
                    else if(ifr) { url = ifr.src; isYT = true; }
                }
                if(typeof window.parent.openEditVideoModal === 'function') window.parent.openEditVideoModal(v, url, isYT);
                else if(typeof window.openEditVideoModal === 'function') window.openEditVideoModal(v, url, isYT);
                else if(typeof openEditVideoModal === 'function') openEditVideoModal(v, url, isYT);
                
                document.getElementById('custom-context-menu').style.display='none';
            ">🎥 Edit Video Source</div>`;
            
            html += `<div class="context-menu-item" style="padding: 8px 15px; cursor: pointer; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #dc3545;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'" onclick="
                if(typeof window.parent.captureState === 'function') window.parent.captureState();
                if(window.parent.confirm('Delete this video?')) {
                    const wrapper = window.parent.currentContextTarget.closest('.eweb-video-wrapper, .eweb-video-widget, .ratio');
                    if (wrapper) wrapper.remove(); else window.parent.currentContextTarget.remove();
                    if(window.parent.document.getElementById('save-btn')) window.parent.document.getElementById('save-btn').disabled = false;
                    if(typeof window.parent.captureState === 'function') window.parent.captureState();
                }
                document.getElementById('custom-context-menu').style.display='none';
            ">🗑️ Delete Video</div>`;
        }
        
        // 4. TEXT OPTIONS
        else if (hasTextSelection) {
            html += `<div class="menu-header" style="padding: 5px; font-size: 11px; font-weight: bold; color: #888; background: #f8f9fa; border-bottom: 1px solid #ddd; text-align: center; border-radius: 6px 6px 0 0;">Text Options</div>`;
            html += `<button id="ctx-cut-txt" style="display:block; width:100%; text-align:left; padding:8px 15px; background:none; border:none; cursor:pointer; font-size:13px; color:#333; border-bottom:1px solid #eee;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">✂️ Cut</button>`;
            html += `<button id="ctx-copy-txt" style="display:block; width:100%; text-align:left; padding:8px 15px; background:none; border:none; cursor:pointer; font-size:13px; color:#333; border-bottom:1px solid #eee;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">📋 Copy</button>`;
            html += `<button id="ctx-paste-txt" style="display:block; width:100%; text-align:left; padding:8px 15px; background:none; border:none; cursor:pointer; font-size:13px; color:#333; border-bottom:1px solid #eee;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">📥 Paste</button>`;
            html += `<button id="ctx-unified-link-txt" style="display:block; width:100%; text-align:left; padding:8px 15px; background:none; border:none; cursor:pointer; font-size:13px; color:#333; border-bottom:1px solid #eee;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">🔗 Link to URL / Hyperlink</button>`;
            if(element.closest('a')) html += `<button id="ctx-unlink" style="display:block; width:100%; text-align:left; padding:8px 15px; background:none; border:none; cursor:pointer; font-size:13px; color:#333; border-bottom:1px solid #eee;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">🔗 Remove Link</button>`;
        } 
        
        // 5. GENERAL OPTIONS
        else {
            html += `<div class="menu-header" style="padding: 5px; font-size: 11px; font-weight: bold; color: #888; background: #f8f9fa; border-bottom: 1px solid #ddd; text-align: center; border-radius: 6px 6px 0 0;">Insert Options</div>`;
            html += `<button id="ctx-add-element-gen" style="display:block; width:100%; text-align:left; padding:8px 15px; background:none; border:none; cursor:pointer; font-size:13px; color:#333; border-bottom:1px solid #eee;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">➕ +Add Widget</button>`;
            html += `<button id="ctx-add-saved-gen" style="display:block; width:100%; text-align:left; padding:8px 15px; background:none; border:none; cursor:pointer; font-size:13px; color:#333; border-bottom:1px solid #eee;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">💾 Add Saved Section Here</button>`;

            html += `<div class="menu-header" style="padding: 5px; font-size: 11px; font-weight: bold; color: #888; background: #f8f9fa; border-bottom: 1px solid #ddd; text-align: center; border-radius: 6px 6px 0 0;">General Options</div>`;
            html += `<button id="ctx-add-img-gen" style="display:block; width:100%; text-align:left; padding:8px 15px; background:none; border:none; cursor:pointer; font-size:13px; color:#333; border-bottom:1px solid #eee;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">🖼️ Add Image Here</button>`;
            
            html += `<button id="ctx-add-logo-gen" style="display:block; width:100%; text-align:left; padding:8px 15px; background:none; border:none; cursor:pointer; font-size:13px; color:#333; border-bottom:1px solid #eee;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">✨ Add Logo Here (200x70)</button>`;
            
            const heroEl = element.closest('header, section, footer, .eweb-section');
            const blockEl = element.closest('.col, .col-md-4, .col-md-6, .card, .grid-item, .eweb-column, .eweb-block');
            const targetBgElement = heroEl || blockEl || element;
            const hasHeroSlider = targetBgElement.querySelector('.eweb-hero-slider');

            if (targetBgElement.tagName === 'SECTION' || targetBgElement.tagName === 'HEADER' || targetBgElement.tagName === 'FOOTER' || targetBgElement.classList.contains('col') || targetBgElement.classList.contains('eweb-column') || targetBgElement.classList.contains('eweb-block')) {
                
                html += `<button id="ctx-set-bg-img" style="display:block; width:100%; text-align:left; padding:8px 15px; background:none; border:none; cursor:pointer; font-size:13px; color:#333; border-bottom:1px solid #eee;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">🌄 Set Background Image</button>`;
                html += `<button id="ctx-set-bg-col" style="display:block; width:100%; text-align:left; padding:8px 15px; background:none; border:none; cursor:pointer; font-size:13px; color:#333; border-bottom:1px solid #eee;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">🎨 Set Background Color</button>`;
              
                if (hasHeroSlider) {
                    html += `<button id="ctx-edit-hero-slider" style="display:block; width:100%; text-align:left; padding:8px 15px; background:none; border:none; cursor:pointer; font-size:13px; color:#333; border-bottom:1px solid #eee;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">✏️ Edit Image Slideshow</button>`;
                } else {
                    html += `<button id="ctx-add-hero-slider" style="display:block; width:100%; text-align:left; padding:8px 15px; background:none; border:none; cursor:pointer; font-size:13px; color:#333; border-bottom:1px solid #eee;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">🎞️ Add Image Slideshow</button>`;
                }

                html += `<button id="ctx-remove-bg" style="color:#e74c3c; display:block; width:100%; text-align:left; padding:8px 15px; background:none; border:none; cursor:pointer; font-size:13px; border-bottom:1px solid #eee; font-weight:bold;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">🚫 Remove Background / Hero Image</button>`;
            }
            html += `<button id="ctx-paste-gen" style="display:block; width:100%; text-align:left; padding:8px 15px; background:none; border:none; cursor:pointer; font-size:13px; color:#333; border-bottom:1px solid #eee;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">📥 Paste Text</button>`;
            html += `<button id="ctx-paste-sec-gen" style="display:block; width:100%; text-align:left; padding:8px 15px; background:none; border:none; cursor:pointer; font-size:13px; color:#333; border-bottom:1px solid #eee;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">📋 Paste Image/Section (From Clipboard)</button>`;
        }

        if (isBuyBtn) {
            html += `<div class="menu-header" style="margin-top:5px;border-top:1px solid #eee; padding: 5px; font-size: 11px; font-weight: bold; color: #888; background: #f8f9fa; border-bottom: 1px solid #ddd; text-align: center;">Commerce</div><button id="ctx-edit-product" style="display:block; width:100%; text-align:left; padding:8px 15px; background:none; border:none; cursor:pointer; font-size:13px; color:#333; border-bottom:1px solid #eee;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">📝 Edit Product Details</button>`;
        }

        menu.innerHTML = html;
        
        const menuWidth = 200;
        let menuHeight = 280;
        if(targetCarousel || targetVideo) menuHeight = 160; 
        else if (targetImage) menuHeight = 290;
        
        let x = e.clientX;
        let y = e.clientY;
        
        const winWidth = doc.defaultView.innerWidth;
        const winHeight = doc.defaultView.innerHeight;

        if (x + menuWidth > winWidth) x -= menuWidth;
        if (y + menuHeight > winHeight) y -= menuHeight;
        
        menu.style.left = x + 'px';
        menu.style.top = y + 'px';
        menu.style.display = 'block'; 

        // Event Listeners for Images
        if(targetImage && !targetCarousel && !targetVideo) {
            const wrapper = targetImage.closest('.image-wrapper-editable');
            menu.querySelector('#ctx-cut-img').onclick = () => { if(typeof window.captureState === 'function') window.captureState(); if(wrapper){ window.copySection(wrapper); wrapper.remove(); } else { window.copySection(targetImage); targetImage.remove(); } menu.style.display='none'; if(document.getElementById('save-btn')) document.getElementById('save-btn').disabled=false; if(typeof window.captureState === 'function') window.captureState(); };
            
            menu.querySelector('#ctx-copy-img').onclick = () => { if(wrapper) window.copySection(wrapper); else window.copySection(targetImage); menu.style.display='none'; };
            
            menu.querySelector('#ctx-paste-img').onclick = async () => { 
                menu.style.display = 'none';
                try {
                    const clipboardItems = await navigator.clipboard.read();
                    for (const item of clipboardItems) {
                        const imageTypes = item.types.filter(type => type.startsWith('image/'));
                        if (imageTypes.length > 0) {
                            if(typeof window.captureState === 'function') window.captureState(); 
                            const blob = await item.getType(imageTypes[0]);
                            const reader = new FileReader();
                            reader.onload = (e) => {
                                targetImage.src = e.target.result;
                                if(document.getElementById('save-btn')) document.getElementById('save-btn').disabled=false;
                                if(typeof window.captureState === 'function') window.captureState();
                                if(typeof updateStatus === 'function') updateStatus("✅ Image pasted from clipboard.");
                            };
                            reader.readAsDataURL(blob);
                            return; 
                        }
                    }
                } catch (err) {
                    console.log("Clipboard API image read failed/unsupported. Falling back.", err);
                }

                if (window._ewebCopiedHTML && window._ewebCopiedHTML.includes('<img')) {
                    if(typeof window.captureState === 'function') window.captureState(); 
                    const temp = doc.createElement('div');
                    temp.innerHTML = window._ewebCopiedHTML;
                    const copiedImg = temp.querySelector('img');
                    if (copiedImg) {
                        targetImage.src = copiedImg.src;
                        if(document.getElementById('save-btn')) document.getElementById('save-btn').disabled=false;
                        if(typeof window.captureState === 'function') window.captureState();
                        if(typeof updateStatus === 'function') updateStatus("✅ Image replaced from local copy.");
                        return; 
                    }
                }
                
                if(typeof window.captureState === 'function') window.captureState(); 
                window.currentImageToReplace = targetImage; 
                let fileInput = document.getElementById('image-upload-input') || (window.parent && window.parent.document.getElementById('image-upload-input')); 
                if(fileInput) fileInput.click(); 
            };

            menu.querySelector('#ctx-add-img').onclick = () => { if(typeof window.captureState === 'function') window.captureState(); window.insertImageInDoc(doc); menu.style.display='none'; };
            
            menu.querySelector('#ctx-del-img').onclick = () => { 
                if(typeof window.captureState === 'function') window.captureState(); 
                if(window.parent.confirm("Delete this image?")) { if(wrapper) wrapper.remove(); else targetImage.remove(); if(document.getElementById('save-btn')) document.getElementById('save-btn').disabled = false; if(typeof window.captureState === 'function') window.captureState(); } 
                menu.style.display='none'; 
            };

            menu.querySelector('#ctx-unified-link-img').onclick = () => {
                menu.style.display='none';
                window.openUnifiedLinkModal(targetImage);
            };
        }

        // TEXT LISTENER 
        if(hasTextSelection && !targetCarousel && !targetVideo && !targetImage) {
            const savedRange = sel.getRangeAt(0).cloneRange();
            const iframe = document.getElementById('preview-frame');

            const executeWithSelection = (cmd, val = null) => {
                if(iframe && iframe.contentWindow) iframe.contentWindow.focus();
                const currentSel = doc.getSelection();
                currentSel.removeAllRanges();
                currentSel.addRange(savedRange);
                doc.execCommand(cmd, false, val);
            };

            menu.querySelector('#ctx-cut-txt').onclick = () => { if(typeof window.captureState === 'function') window.captureState(); executeWithSelection('cut'); menu.style.display='none'; if(document.getElementById('save-btn')) document.getElementById('save-btn').disabled=false; if(typeof window.captureState === 'function') window.captureState(); };
            menu.querySelector('#ctx-copy-txt').onclick = () => { executeWithSelection('copy'); menu.style.display='none'; };
            menu.querySelector('#ctx-paste-txt').onclick = async () => { 
                try { 
                    const text = await navigator.clipboard.readText(); 
                    if(text) { if(typeof window.captureState === 'function') window.captureState(); executeWithSelection('insertText', text); if(document.getElementById('save-btn')) document.getElementById('save-btn').disabled=false; if(typeof window.captureState === 'function') window.captureState(); } 
                } catch(err) { alert("Browser prevented paste. Use Ctrl+V."); } 
                menu.style.display='none'; 
            };

            menu.querySelector('#ctx-unified-link-txt').onclick = () => {
                    menu.style.display='none';
                    window.lastValidRange = savedRange;
                    window.openUnifiedLinkModal(null); 
            };

            const unlink = menu.querySelector('#ctx-unlink');
            if(unlink) unlink.onclick = () => { if(typeof window.captureState === 'function') window.captureState(); executeWithSelection('unlink'); if(document.getElementById('save-btn')) document.getElementById('save-btn').disabled=false; if(typeof window.captureState === 'function') window.captureState(); menu.style.display='none'; };
        }

        if(!targetImage && !targetVideo && !targetCarousel && !hasTextSelection) {
            
            const heroEl = element.closest('header, section, footer, .eweb-section');
            const blockEl = element.closest('.col, .col-md-4, .col-md-6, .card, .grid-item, .eweb-column, .eweb-block');
            const targetBgElement = heroEl || blockEl || element;
            const hasHeroSlider = targetBgElement ? targetBgElement.querySelector('.eweb-hero-slider') : null;

            const addElementBtn = menu.querySelector('#ctx-add-element-gen');
            if(addElementBtn) {
                addElementBtn.onclick = () => {
                    window.__insertTarget = element.closest('.col, .col-md-4, .col-md-6, .eweb-column, .eweb-block, section, .eweb-section') || element; 
                    
                    const addBtnSidebar = document.getElementById('sidebar-add-btn') || (window.parent && window.parent.document.getElementById('sidebar-add-btn'));
                    const elementsSlider = document.getElementById('elements-slider') || document.getElementById('ui-elements-slider') || (window.parent && (window.parent.document.getElementById('elements-slider') || window.parent.document.getElementById('ui-elements-slider')));
                    const overlay = document.getElementById('slider-overlay') || (window.parent && window.parent.document.getElementById('slider-overlay'));

                    if (typeof window.toggleUIElementsSlider === 'function') {
                        window.toggleUIElementsSlider();
                    } else if (window.parent && typeof window.parent.toggleUIElementsSlider === 'function') {
                        window.parent.toggleUIElementsSlider();
                    } else if (addBtnSidebar) {
                        addBtnSidebar.click();
                    } else if (elementsSlider) {
                        elementsSlider.classList.add('open');
                        if(overlay) overlay.style.display = 'block';
                    }
                    menu.style.display = 'none';
                    if(typeof updateStatus === 'function') updateStatus("Click an element in the sidebar to insert it here.");
                };
            }

            const addSavedBtn = menu.querySelector('#ctx-add-saved-gen');
            if(addSavedBtn) {
                addSavedBtn.onclick = () => {
                    window.__insertTarget = element.closest('.col, .col-md-4, .col-md-6, .eweb-column, .eweb-block, section, .eweb-section') || element; 
                    if(typeof loadSavedSectionsUI === 'function') loadSavedSectionsUI();
                    const savedModal = document.getElementById('insert-saved-modal') || (window.parent && window.parent.document.getElementById('insert-saved-modal'));
                    if(savedModal) savedModal.style.display = 'flex';
                    menu.style.display = 'none';
                    if(typeof updateStatus === 'function') updateStatus("Click a saved section/template to insert it here.");
                };
            }

            const addImgGenBtn = menu.querySelector('#ctx-add-img-gen');
            if (addImgGenBtn) {
                addImgGenBtn.onclick = () => { 
                    if(typeof window.captureState === 'function') window.captureState(); 
                    window.insertImageInDoc(doc); 
                    menu.style.display='none'; 
                };
            }

            const addLogoGenBtn = menu.querySelector('#ctx-add-logo-gen');
            if (addLogoGenBtn) {
                addLogoGenBtn.onclick = () => {
                    if(typeof window.captureState === 'function') window.captureState();
                    if(typeof window.initiateLogoInsert === 'function') {
                        window.initiateLogoInsert(doc);
                    } else if (window.parent && typeof window.parent.initiateLogoInsert === 'function') {
                        window.parent.initiateLogoInsert(doc);
                    }
                    menu.style.display='none';
                };
            }
            
            // BACKGROUND IMAGE
            const setBgImgBtn = menu.querySelector('#ctx-set-bg-img');
            if (setBgImgBtn) {
                setBgImgBtn.onclick = () => {
                    if(typeof window.captureState === 'function') window.captureState();
                    window.currentBgElementToReplace = targetBgElement;
                    
                    let fileInput = document.getElementById('image-upload-input') || (window.parent && window.parent.document.getElementById('image-upload-input'));
                    if (fileInput) {
                        fileInput.click();
                    }
                    menu.style.display='none';
                };
            }

            // BACKGROUND COLOR
            const setBgColBtn = menu.querySelector('#ctx-set-bg-col');
            if (setBgColBtn) {
                setBgColBtn.onclick = () => {
                    if(typeof window.captureState === 'function') window.captureState();
                    window.currentBgElementToReplace = targetBgElement;
                    let bgInput = document.getElementById('dynamic-bg-color-picker');
                    if(!bgInput) {
                        bgInput = document.createElement('input');
                        bgInput.type = 'color';
                        bgInput.id = 'dynamic-bg-color-picker';
                        bgInput.style.position = 'absolute';
                        bgInput.style.opacity = '0';
                        bgInput.style.pointerEvents = 'none';
                        document.body.appendChild(bgInput);
                        bgInput.addEventListener('input', (ev) => { if (window.currentBgElementToReplace) window.currentBgElementToReplace.style.backgroundColor = ev.target.value; });
                        bgInput.addEventListener('change', (ev) => {
                            if (window.currentBgElementToReplace) {
                                window.currentBgElementToReplace.style.backgroundColor = ev.target.value;
                                if(typeof updateStatus === 'function') updateStatus('Background color updated.');
                                if(typeof enableSaveButton === 'function') enableSaveButton();
                                if(typeof window.captureState === 'function') window.captureState();
                                window.currentBgElementToReplace = null;
                            }
                        });
                    }
                    try { bgInput.showPicker(); } catch(ex) { bgInput.click(); }
                    menu.style.display='none';
                };
            }

            // --- HERO SLIDESHOW LOGIC CLICKS ---
            const setHeroSliderBtn = menu.querySelector('#ctx-add-hero-slider');
            if (setHeroSliderBtn) {
                setHeroSliderBtn.onclick = () => {
                    if(typeof window.captureState === 'function') window.captureState();
                    window.currentBgElementToReplace = targetBgElement;
                    if (typeof window.openHeroSliderModal === 'function') window.openHeroSliderModal(doc, false);
                    else if (window.parent && typeof window.parent.openHeroSliderModal === 'function') window.parent.openHeroSliderModal(doc, false);
                    menu.style.display='none';
                };
            }

            const editHeroSliderBtn = menu.querySelector('#ctx-edit-hero-slider');
            if (editHeroSliderBtn) {
                editHeroSliderBtn.onclick = () => {
                    if(typeof window.captureState === 'function') window.captureState();
                    window.currentBgElementToReplace = targetBgElement;
                    if (typeof window.openHeroSliderModal === 'function') window.openHeroSliderModal(doc, true);
                    else if (window.parent && typeof window.parent.openHeroSliderModal === 'function') window.parent.openHeroSliderModal(doc, true);
                    menu.style.display='none';
                };
            }
            
            // --- FIX: AGGRESSIVE REMOVE BACKGROUND / HERO IMAGE ---
            const removeBgBtn = menu.querySelector('#ctx-remove-bg');
            if (removeBgBtn) {
                removeBgBtn.onclick = () => {
                    if(typeof window.captureState === 'function') window.captureState();
                    
                    // 1. Force remove inline styles
                    targetBgElement.style.setProperty('background-image', 'none', 'important');
                    targetBgElement.style.setProperty('background-color', 'transparent', 'important');
                    targetBgElement.style.setProperty('background', 'transparent', 'important');
                    
                    // 2. Strip conflicting classes
                    const bgClasses = Array.from(targetBgElement.classList).filter(c => c.startsWith('bg-'));
                    if(bgClasses.length > 0) targetBgElement.classList.remove(...bgClasses);
                    
                    // 3. Destroy specific absolute-positioned children acting as background layers
                    Array.from(targetBgElement.children).forEach(child => {
                        const style = window.getComputedStyle(child);
                        if (style.position === 'absolute' && (style.zIndex === '-1' || style.zIndex === '0' || child.classList.contains('overlay') || child.classList.contains('bg-image') || child.tagName === 'IMG')) {
                            // Don't accidentally hide the whole container or text
                            if (!child.classList.contains('container') && !child.classList.contains('row') && !child.classList.contains('eweb-hero-slider')) {
                                child.style.display = 'none';
                            }
                        }
                    });

                    // 4. Delete the Slideshow if present
                    const slider = targetBgElement.querySelector('.eweb-hero-slider');
                    if (slider) slider.remove();
                    
                    // 5. Clean up shadow wrappers
                    targetBgElement.classList.remove('hero-fallback');
                    targetBgElement.querySelectorAll('.hero-text-shadow').forEach(t => t.classList.remove('hero-text-shadow'));
                    
                    if(typeof updateStatus === 'function') updateStatus('Background/Hero Image removed.');
                    if(typeof enableSaveButton === 'function') enableSaveButton();
                    if(typeof window.captureState === 'function') window.captureState();
                    menu.style.display='none';
                };
            }

            menu.querySelector('#ctx-paste-sec-gen').onclick = () => { if(typeof window.captureState === 'function') window.captureState(); window.pasteSection(element, 'beforeend'); menu.style.display='none'; };
            
            menu.querySelector('#ctx-paste-gen').onclick = async () => {
                menu.style.display = 'none';
                try { 
                    const text = await navigator.clipboard.readText(); 
                    if(text) { 
                        if(typeof window.captureState === 'function') window.captureState();
                        
                        const textContainer = element.closest('p, h1, h2, h3, h4, h5, h6, span, div, a, li, td, th') || element;
                        
                        if (textContainer) {
                            const textNode = doc.createTextNode(text);
                            textContainer.appendChild(textNode);
                        }
                        
                        if(document.getElementById('save-btn')) document.getElementById('save-btn').disabled=false; 
                        if(typeof window.captureState === 'function') window.captureState();
                        if(typeof updateStatus === 'function') updateStatus("✅ Text pasted.");
                    } 
                } catch(err) { alert("Browser prevented clipboard read. Please click inside a text block and use Ctrl+V."); } 
            };
        }
    };

    window.openUnifiedLinkModal = function(targetImage) {
        window.pendingLinkTarget = targetImage;
        const modal = document.getElementById('hyperlink-modal');
        modal.style.display = 'flex';
        
        const iframe = document.getElementById('preview-frame');
        const doc = window.currentContextDoc || iframe.contentDocument || iframe.contentWindow.document;

        const pageSelect = document.getElementById('link-page-select');
        pageSelect.innerHTML = '';
        const pages = Object.keys(generatedFiles).filter(f => f.endsWith('.html'));
        if(pages.length === 0) {
            const opt = document.createElement('option'); opt.text = "No pages available"; pageSelect.appendChild(opt);
        } else {
            pages.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p;
                opt.text = p;
                pageSelect.appendChild(opt);
            });
        }

        let existingUrl = '';
        if (targetImage) {
            const parentA = targetImage.closest('a');
            if (parentA) existingUrl = parentA.getAttribute('href');
        } else {
            if (typeof window.lastValidRange !== 'undefined' && window.lastValidRange) {
                const node = window.lastValidRange.commonAncestorContainer;
                const parentEl = node.nodeType === 1 ? node : node.parentElement;
                const closestA = parentEl.closest('a');
                if (closestA) existingUrl = closestA.getAttribute('href');
            } else {
                if(!targetImage) {
                    console.warn("No valid text selection found.");
                }
            }
        }

        const urlInput = document.getElementById('link-url-input');
        const urlRadio = document.querySelector('input[name="link-type"][value="url"]');
        const pageRadio = document.querySelector('input[name="link-type"][value="page"]');

        if (existingUrl && pages.includes(existingUrl)) {
                pageRadio.checked = true;
                window.handleLinkOptionChange('page');
                pageSelect.value = existingUrl;
                urlInput.value = '';
        } else {
                urlRadio.checked = true;
                window.handleLinkOptionChange('url');
                urlInput.value = existingUrl || '';
        }
    };

    window.closeHyperlinkModal = function() {
        document.getElementById('hyperlink-modal').style.display = 'none';
    };

    window.handleLinkOptionChange = function(selectedType) {
        const groupUrl = document.getElementById('group-url');
        const groupPage = document.getElementById('group-page');
        const urlInput = document.getElementById('link-url-input');
        const urlTarget = document.getElementById('link-url-target');
        const pageSelect = document.getElementById('link-page-select');

        if (selectedType === 'url') {
            groupUrl.classList.remove('disabled');
            groupPage.classList.add('disabled');
            urlInput.disabled = false;
            urlTarget.disabled = false;
            pageSelect.disabled = true;
            document.querySelector('input[name="link-type"][value="url"]').checked = true;
        } else {
            groupUrl.classList.add('disabled');
            groupPage.classList.remove('disabled');
            urlInput.disabled = true;
            urlTarget.disabled = true;
            pageSelect.disabled = false;
            document.querySelector('input[name="link-type"][value="page"]').checked = true;
        }
    };

    window.applyUnifiedLink = function() {
        if(typeof window.captureState === 'function') window.captureState();
        
        const selectedType = document.querySelector('input[name="link-type"]:checked').value;
        let finalUrl = '';
        let targetMode = '_self';
        let isGlobal = false;

        if (selectedType === 'url') {
            finalUrl = document.getElementById('link-url-input').value.trim();
            const mode = document.getElementById('link-url-target').value;
            if (mode === '_global_blank') {
                targetMode = '_blank';
                isGlobal = true;
            } else {
                targetMode = mode;
            }
        } else {
            finalUrl = document.getElementById('link-page-select').value;
            targetMode = '_self'; 
        }

        if (!finalUrl) { alert("Please enter a URL or select a page."); return; }

        const iframe = document.getElementById('preview-frame');
        const doc = window.currentContextDoc || iframe.contentDocument || iframe.contentWindow.document;

        if (isGlobal) {
            const allLinks = doc.querySelectorAll('a');
            allLinks.forEach(a => a.target = '_blank');
        }

        if (window.pendingLinkTarget) {
            const wrapper = window.pendingLinkTarget.closest('.image-wrapper-editable');
            let parentA = wrapper ? wrapper.closest('a') : window.pendingLinkTarget.closest('a'); 
            
            if (parentA) {
                parentA.href = finalUrl;
                parentA.target = targetMode;
            } else {
                const a = doc.createElement('a');
                a.href = finalUrl;
                a.target = targetMode;
                const targetNode = wrapper || window.pendingLinkTarget;
                targetNode.parentNode.insertBefore(a, targetNode);
                a.appendChild(targetNode);
            }
        } else {
            if (typeof window.lastValidRange !== 'undefined' && window.lastValidRange) {
                if(iframe.contentWindow) iframe.contentWindow.focus();

                const sel = iframe.contentWindow.getSelection();
                sel.removeAllRanges();
                sel.addRange(window.lastValidRange);

                doc.execCommand('createLink', false, finalUrl);
                
                const newSel = iframe.contentWindow.getSelection();
                if (newSel.rangeCount > 0) {
                    let anchorNode = newSel.anchorNode;
                    let linkNode = anchorNode.nodeType === 1 ? anchorNode : anchorNode.parentElement;
                    if(linkNode.tagName !== 'A') linkNode = linkNode.closest('a');
                    
                    if (linkNode) {
                        linkNode.target = targetMode;
                    } else {
                        const links = doc.querySelectorAll('a[href="' + finalUrl + '"]');
                        if (links.length > 0) links[links.length-1].target = targetMode;
                    }
                }
            } else {
                alert("Please select some text before clicking the Link button.");
            }
        }
        
        if(document.getElementById('save-btn')) document.getElementById('save-btn').disabled = false;
        if(typeof window.captureState === 'function') window.captureState();
        window.closeHyperlinkModal();
        if (typeof updateStatus === 'function') updateStatus("✅ Link applied.");
    };

    window.insertImageAtCursor = function() {
        const iframe = document.getElementById('preview-frame');
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        window.currentContextTarget = null; 
        window.insertImageInDoc(doc);
    };

    window.insertImageInDoc = function(doc, url) {
        window.pendingImageInsert = true;
        if (url) {
            window.insertOrReplaceImage(url);
        } else if(typeof window.openImageManager === 'function') {
            window.openImageManager('image');
        } else if (window.parent && typeof window.parent.openImageManager === 'function') {
             window.parent.openImageManager('image');
        } else {
            let fileInput = document.getElementById('image-upload-input') || (window.parent && window.parent.document.getElementById('image-upload-input'));
            if(fileInput) fileInput.click();
        }
    };
    
    // NEW: Initiate Logo Insertion Pipeline
    window.initiateLogoInsert = function(doc) {
        window.pendingLogoInsert = true;
        
        if(typeof window.openImageManager === 'function') {
            window.openImageManager('logo_insert');
        } else if (window.parent && typeof window.parent.openImageManager === 'function') {
             window.parent.openImageManager('logo_insert');
        } else {
            document.getElementById('image-upload-input').click();
        }
    };

    window.copySection = function(element) {
        const clone = element.cloneNode(true);
        clone.querySelectorAll('.section-action-bar, .bg-edit-container, .image-overlay-controls, .resize-handle, .add-section-btn, .section-resize-handle, .left-add-plus-btn, .inline-add-widget-btn, .eweb-video-overlay, .eweb-plus-btn-top, .eweb-plus-btn-bottom').forEach(t => t.remove());
        clone.querySelectorAll('.image-wrapper-editable').forEach(w => { const i = w.querySelector('img'); if(i) w.parentNode.replaceChild(i, w); });
        
        // Unwrap video correctly for clipboard
        clone.querySelectorAll('.eweb-video-wrapper').forEach(w => { const v = w.querySelector('video, iframe'); if(v) w.parentNode.replaceChild(v, w); });

        fetch('/api/clipboard/save', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ content: clone.outerHTML }) })
        .then(r=>r.json()).then(d => {
            if(d.success) { if(typeof updateStatus === 'function') updateStatus("✅ Copied to clipboard."); }
        });
    };
</script>

<script>
    // --- Globals ---
    let generatedFiles = {};
    let currentChatHistory = [];
    let currentPreviewFile = 'index.html';
    let isEditing = false; 
    let currentUser = null; 
    let adminUsersList = []; 
    
    let speechRecognition = null; 
    let isVoiceActive = false;
    let lastTranscript = '';
    let abortController = null;
    let progressInterval = null;
    let isBuildingSequenceActive = false; 
    let currentCssBuffer = ''; 

    // --- NEW: Client-Side History Logic ---
    let localHistory = [];
    let localHistoryIndex = -1;
    let currentContextTarget = null; // Stores element right-clicked
    let currentContextDoc = null; // Stores the document of the context target
    let typingTimer = null; // Debounce for typing

    // --- FIX: Robust Selection Tracking ---
    // We continuously track the last valid text selection here.
    let lastValidRange = null; 

    const generateBtn = document.getElementById('generate-btn');
    const promptInput = document.getElementById('prompt-input');
    const chatDisplay = document.getElementById('chat-display');
    const statusMessage = document.getElementById('status-message');
    const pageDropdown = document.getElementById('page-dropdown');
    const imageUploadInput = document.getElementById('image-upload-input');
    const voiceEditButton = document.getElementById('voice-edit-btn');
    const codeStreamView = document.getElementById('code-stream-view');
    const iframe = document.getElementById('preview-frame');
    
    let currentImageToReplace = null; 
    let currentBgElementToReplace = null;
    let pendingImageInsert = false;

    // --- NEW: CHAT MODE SWITCHING LOGIC ---
    function setChatMode(mode) {
        // Remove existing modes
        document.body.classList.remove('view-default', 'view-minimized', 'view-maximized');
        // Add new mode
        document.body.classList.add(`view-${mode}`);
    }

    // --- DARK MODE LOGIC ---
    function initDarkMode() {
        const savedMode = localStorage.getItem('darkMode');
        if (savedMode === 'enabled') {
            document.body.classList.add('dark-mode');
            document.getElementById('toggle-dark-mode').textContent = '☀️';
        }
    }

    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        const btn = document.getElementById('toggle-dark-mode');
        if (document.body.classList.contains('dark-mode')) {
            localStorage.setItem('darkMode', 'enabled');
            btn.textContent = '☀️';
        } else {
            localStorage.setItem('darkMode', 'disabled');
            btn.textContent = '🌙';
        }
    }

    // ==========================================
    // --- GOAL 1 FIX: ROBUST FORCED LOGOUT ROUTINE ---
    // ==========================================
    function handleForcedLogout() {
        if (document.body.classList.contains('is-logged-in') || currentUser !== null) {
            currentUser = null;
            document.body.classList.remove('is-logged-in');
            // Use replace() instead of reload() to forcefully navigate without cache/resubmission prompts
            alert("Session Expired: You have been logged out because your account was accessed from another device.");
            window.location.replace('/'); 
        } else {
            document.getElementById('auth-modal').style.display = 'flex';
        }
    }

    // --- AUTH & ADMIN FUNCTIONS ---
    function checkAuth() {
        fetch('/api/check_auth', { cache: "no-store" })
            .then(r => {
                if (r.status === 401 || r.status === 403) {
                    handleForcedLogout();
                    return null;
                }
                return r.json();
            })
            .then(data => {
                if (!data) return;
                
                if (data.authenticated) {
                    currentUser = data;
                    document.getElementById('auth-modal').style.display = 'none';
                    document.getElementById('menu-user-email').textContent = data.email;
                    document.getElementById('profile-icon').textContent = data.full_name ? data.full_name.charAt(0).toUpperCase() : data.email.charAt(0).toUpperCase();
                    
                    if (data.role === 'admin') {
                        document.getElementById('menu-dashboard').style.display = 'block';
                        const upBtn = document.getElementById('sidebar-upgrade-btn');
                        const statsDiv = document.getElementById('sidebar-user-stats');
                        if (upBtn) upBtn.style.display = 'none';
                        if (statsDiv) statsDiv.style.display = 'none';
                    } else {
                        const upBtn = document.getElementById('sidebar-upgrade-btn');
                        const statsDiv = document.getElementById('sidebar-user-stats');
                        if (upBtn) upBtn.style.display = 'flex';
                        if (statsDiv) statsDiv.style.display = 'flex';
                        
                        fetch('/api/profile').then(r=>r.json()).then(prof => {
                            if(prof) {
                                const sitesLeft = prof.websites_remaining !== undefined ? prof.websites_remaining : 'Unlimited';
                                const spaceLeft = prof.storage_remaining_mb ? 
                                    (prof.storage_remaining_mb < 1024 ? prof.storage_remaining_mb + 'MB' : (prof.storage_remaining_mb/1024).toFixed(1) + 'GB') 
                                    : 'Unlimited';
                                const sitesEl = document.getElementById('stat-sites-left');
                                const spaceEl = document.getElementById('stat-space-left');
                                if(sitesEl) sitesEl.textContent = sitesLeft;
                                if(spaceEl) spaceEl.textContent = spaceLeft;
                            }
                        }).catch(e=>console.error("Error loading stats:", e));
                    }
                } else {
                    handleForcedLogout();
                }
            })
            .catch(e => console.warn("checkAuth ping failed."));
    }
    
    function hideAllForms() {
        ['login-form', 'register-form', 'forgot-form', 'verify-form', 'change-pass-form', 'profile-form', 'add-page-modal', 'admin-user-edit-modal'].forEach(id => document.getElementById(id).style.display = 'none');
    }
    function showLogin() { hideAllForms(); document.getElementById('login-form').style.display = 'block'; }
    function showRegister() { hideAllForms(); document.getElementById('register-form').style.display = 'block'; }
    function showForgot() { hideAllForms(); document.getElementById('forgot-form').style.display = 'block'; }
    function showVerify(email) { 
        hideAllForms(); 
        document.getElementById('verify-form').style.display = 'block';
        document.getElementById('verify-form').dataset.email = email;
    }
    function showChangePass() { 
        document.getElementById('auth-modal').style.display = 'flex'; 
        hideAllForms();
        document.getElementById('change-pass-form').style.display = 'block';
        document.getElementById('profile-menu').style.display = 'none';
    }
    function hideChangePass() {
        document.getElementById('auth-modal').style.display = 'none';
        document.getElementById('cp-old').value = '';
        document.getElementById('cp-new').value = '';
    }

    function showProfile() {
        document.getElementById('auth-modal').style.display = 'flex';
        hideAllForms();
        document.getElementById('profile-form').style.display = 'block';
        document.getElementById('profile-menu').style.display = 'none';
        
        if(currentUser) {
            fetch('/api/profile').then(r=>r.json()).then(data => {
                document.getElementById('prof-name').value = data.full_name || '';
                document.getElementById('prof-email').value = data.email || '';
                document.getElementById('prof-phone').value = data.phone_number || '';
                document.getElementById('prof-username').value = data.username || '';
            });
        }
    }
    function hideProfile() { document.getElementById('auth-modal').style.display = 'none'; }

    document.getElementById('reg-email').addEventListener('input', function(e) {
        const val = e.target.value;
        const preview = document.getElementById('username-preview');
        if(val && val.includes('@')) {
            const username = val.split('@')[0];
            preview.textContent = `Username: ${username}`;
        } else {
            preview.textContent = "Username: (auto-generated)";
        }
    });

    // HANDLERS
    function handleLogin() {
        const id = document.getElementById('login-id').value;
        const pass = document.getElementById('login-pass').value;
        fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ identifier: id, password: pass })
        }).then(r => r.json()).then(data => {
            if (data.success) { location.reload(); } 
            else { document.getElementById('auth-msg').textContent = data.error; }
        });
    }

    function handleRegister() {
        const full_name = document.getElementById('reg-fullname').value;
        const email = document.getElementById('reg-email').value;
        const phone = document.getElementById('reg-phone').value;
        const pass = document.getElementById('reg-pass').value;
        
        fetch('/api/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ full_name, email, phone_number: phone, password: pass })
        }).then(r => r.json()).then(data => {
            if (data.success) {
                showVerify(email);
                alert(data.message); 
            } else {
                document.getElementById('reg-msg').textContent = data.error;
            }
        });
    }

    function handleVerify() {
        const code = document.getElementById('ver-code').value;
        const email = document.getElementById('verify-form').dataset.email;
        fetch('/api/verify', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ email, code })
        }).then(r => r.json()).then(data => {
            if (data.success) {
                showLogin();
                document.getElementById('auth-msg').textContent = "Verified! Please Login.";
            } else {
                document.getElementById('ver-msg').textContent = data.error;
            }
        });
    }
    
    function handleForgot() {
        const email = document.getElementById('forgot-email').value;
        fetch('/api/forgot_password', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ email })
        }).then(r => r.json()).then(data => {
            document.getElementById('forgot-msg').textContent = data.message || data.error;
        });
    }

    function handleChangePass() {
        const oldP = document.getElementById('cp-old').value;
        const newP = document.getElementById('cp-new').value;
        fetch('/api/change_password', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ old_password: oldP, new_password: newP })
        }).then(r => r.json()).then(data => {
            if(data.success) { alert('Password changed!'); hideChangePass(); } 
            else { document.getElementById('cp-msg').textContent = data.error; }
        });
    }

    function handleUpdateProfile() {
        const full_name = document.getElementById('prof-name').value;
        const email = document.getElementById('prof-email').value;
        const phone = document.getElementById('prof-phone').value;
        fetch('/api/update_profile', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ full_name, email, phone_number: phone })
        }).then(r => r.json()).then(data => {
            if (data.success) { alert('Profile updated!'); checkAuth(); } 
            else { document.getElementById('prof-msg').textContent = data.error; }
        });
    }

    function handleLogout() {
        fetch('/api/logout', {method: 'POST'}).then(() => window.location.replace('/'));
    }

    function toggleProfileMenu() {
        const menu = document.getElementById('profile-menu');
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }
    
    // --- NEW: ADD PAGE MODAL LOGIC ---
    function handlePageDropdown(value) {
        if (value === '__NEW_PAGE__') {
            showAddPageModal();
            // Reset dropdown to current page so it doesn't stay on "Add New Page" if cancelled
            pageDropdown.value = currentPreviewFile;
        } else {
            loadPreview(value);
        }
    }

    function showAddPageModal() {
        document.getElementById('auth-modal').style.display = 'flex';
        hideAllForms();
        document.getElementById('add-page-modal').style.display = 'block';
        
        // Populate Base Page Dropdown
        const baseSelect = document.getElementById('new-page-base');
        baseSelect.innerHTML = '';
        const files = Object.keys(generatedFiles).filter(f => f.endsWith('.html'));
        files.forEach(f => {
            const opt = document.createElement('option');
            opt.value = f;
            opt.textContent = f;
            if(f === currentPreviewFile) opt.selected = true;
            baseSelect.appendChild(opt);
        });
        
        document.getElementById('new-page-name').value = '';
        document.getElementById('new-page-file-preview').textContent = 'URL: ...';
        document.getElementById('add-page-msg').textContent = '';
    }

    function closeAddPageModal() {
        document.getElementById('auth-modal').style.display = 'none';
    }

    function updateNewPagePreview() {
        const rawName = document.getElementById('new-page-name').value;
        if(!rawName) {
            document.getElementById('new-page-file-preview').textContent = 'URL: ...';
            return;
        }
        // Simple slugify: lowercase, replace spaces with hyphens, remove special chars
        let clean = rawName.trim().toLowerCase();
        clean = clean.replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-');
        document.getElementById('new-page-file-preview').textContent = `URL: ${clean}.html`;
    }

    function createNewPage() {
        const basePage = document.getElementById('new-page-base').value;
        const newName = document.getElementById('new-page-name').value;
        
        if(!basePage || !newName) {
            document.getElementById('add-page-msg').textContent = "Please fill all fields.";
            return;
        }

        fetch('/create_page', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ base_page: basePage, new_page_name: newName })
        })
        .then(r => r.json())
        .then(data => {
            if(data.success) {
                // Update local state
                const newFile = data.new_filename;
                generatedFiles[newFile] = generatedFiles[basePage]; // Copy content locally for immediate switch (optional, loadPreview fetches it anyway)
                
                // Switch to new page
                alert(data.message);
                closeAddPageModal();
                
                // Force a reload of the dropdown to include the new page
                updatePageDropdown(newFile);
                loadPreview(newFile);
            } else {
                document.getElementById('add-page-msg').textContent = data.error;
            }
        })
        .catch(err => {
            document.getElementById('add-page-msg').textContent = "Server error.";
        });
    }

    // --- ADMIN DASHBOARD ---
    function openAdminDashboard() {
        document.getElementById('admin-dashboard').style.display = 'block';
        
        // FIX: Hide sidebar when in CMS
        const sidebar = document.getElementById('editor-sidebar');
        if(sidebar) sidebar.style.display = 'none';
        
        // FIX: Hide chatbox when in CMS
        const chatbox = document.getElementById('left-panel');
        if(chatbox) chatbox.style.display = 'none';
        
        if(typeof closeElementsSlider === 'function') closeElementsSlider();
        
        loadAdminUsers();
        loadAdminSettings();
    }
    
    function closeAdminDashboard() { 
        document.getElementById('admin-dashboard').style.display = 'none'; 
        
        // FIX: Show sidebar again when leaving CMS
        const sidebar = document.getElementById('editor-sidebar');
        if(sidebar) sidebar.style.display = 'flex';
        
        // FIX: Show chatbox again when leaving CMS
        const chatbox = document.getElementById('left-panel');
        if(chatbox) chatbox.style.display = '';
    }
    
    function switchAdminTab(tabId, navItem) {
        document.querySelectorAll('.admin-nav-item').forEach(i => i.classList.remove('active'));
        navItem.classList.add('active');
        document.querySelectorAll('.admin-tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
    }

    function loadAdminUsers() {
        fetch('/api/admin/users').then(r => r.json()).then(users => {
            adminUsersList = users;
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';
            users.forEach(u => {
                tbody.innerHTML += `
                    <tr>
                        <td>${u.id}</td>
                        <td><b>${u.username || 'N/A'}</b><br><span style="font-size:0.8em; color:#666;">${u.email}</span></td>
                        <td>${u.full_name || '-'}<br><span style="font-size:0.8em;">${u.phone || '-'}</span></td>
                        <td>${u.role}</td>
                        <td>${u.verified ? '✅' : '❌'}</td>
                        <td>
                            <button onclick="openAdminEditUser(${u.id})" style="padding:2px 8px; font-size:12px; cursor:pointer; background:#007bff; color:white; border-radius:3px; border:none;">Edit</button>
                            <button onclick="toggleVerify(${u.id})" style="padding:2px 8px; font-size:12px; cursor:pointer; background:${u.verified ? '#ffc107' : '#28a745'}; color:${u.verified?'#333':'white'}; border-radius:3px; border:none; margin-left:3px;">${u.verified ? 'Unverify' : 'Verify'}</button>
                            <button onclick="resetPass(${u.id})" style="padding:2px 8px; font-size:12px; cursor:pointer; background:#6c757d; color:white; border-radius:3px; border:none; margin-left:3px;">Reset PW</button>
                            <button onclick="deleteUser(${u.id})" style="padding:2px 8px; font-size:12px; cursor:pointer; background:#dc3545; color:white; border-radius:3px; border:none; margin-left:3px;">Delete</button>
                        </td>
                    </tr>
                `;
            });
        });
    }

    function toggleVerify(uid) {
        fetch('/api/admin/toggle_verify', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user_id: uid })
        }).then(r => r.json()).then(d => { if(d.success) loadAdminUsers(); else alert(d.error); });
    }

    function deleteUser(uid) {
        if(!confirm("Are you sure you want to delete this user? This cannot be undone.")) return;
        fetch('/api/admin/delete_user', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user_id: uid })
        }).then(r => r.json()).then(d => { if(d.success) { alert(d.message); loadAdminUsers(); } else alert(d.error); });
    }

    function openAdminEditUser(userId) {
        const user = adminUsersList.find(u => u.id === userId);
        if (!user) return;
        document.getElementById('auth-modal').style.display = 'flex';
        hideAllForms();
        document.getElementById('admin-user-edit-modal').style.display = 'block';
        document.getElementById('admin-edit-id').value = user.id;
        document.getElementById('admin-edit-username').value = user.username || '';
        document.getElementById('admin-edit-fullname').value = user.full_name || '';
        document.getElementById('admin-edit-email').value = user.email || '';
        document.getElementById('admin-edit-phone').value = user.phone || '';
        document.getElementById('admin-edit-role').value = user.role || 'client';
        document.getElementById('admin-edit-verified').checked = user.verified;
        document.getElementById('admin-edit-msg').textContent = '';
    }

    function closeAdminEditModal() { document.getElementById('auth-modal').style.display = 'none'; }

    function saveAdminUserChanges() {
        const uid = document.getElementById('admin-edit-id').value;
        const data = {
            user_id: uid,
            username: document.getElementById('admin-edit-username').value,
            full_name: document.getElementById('admin-edit-fullname').value,
            email: document.getElementById('admin-edit-email').value,
            phone_number: document.getElementById('admin-edit-phone').value,
            role: document.getElementById('admin-edit-role').value,
            verified: document.getElementById('admin-edit-verified').checked
        };
        fetch('/api/admin/update_user', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        }).then(r => r.json()).then(res => {
            if (res.success) { alert("User updated successfully!"); closeAdminEditModal(); loadAdminUsers(); } 
            else { document.getElementById('admin-edit-msg').textContent = res.error; }
        });
    }

    function resetPass(uid) {
        if(!confirm("Reset password to 'temp1234'?")) return;
        fetch('/api/admin/reset_user_pass', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user_id: uid })
        }).then(r => r.json()).then(d => alert(d.message));
    }
    
    function toggleEmailFields() {
        const method = document.getElementById('email-method').value;
        if (method === 'smtp') {
            document.getElementById('smtp-fields').style.display = 'block';
            document.getElementById('api-fields').style.display = 'none';
        } else {
            document.getElementById('smtp-fields').style.display = 'none';
            document.getElementById('api-fields').style.display = 'block';
        }
    }

    function renderImageProviders(jsonStr) {
        const container = document.getElementById('image-providers-list');
        container.innerHTML = '';
        let providers = {};
        try { providers = JSON.parse(jsonStr) || {}; } catch(e) {}
        ['pexels', 'unsplash', 'pixabay', 'pollinations', 'freepik', 'shutterstock', 'mighty'].forEach(p => {
            if(!providers[p]) providers[p] = { enabled: false, key: '', type: (p==='pollinations'?'free':'paid') };
        });
        Object.keys(providers).forEach(p => {
            const config = providers[p];
            const div = document.createElement('div');
            div.className = 'settings-group';
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <strong>${p.toUpperCase()}</strong>
                    <label><input type="checkbox" class="prov-enable" data-prov="${p}" ${config.enabled ? 'checked' : ''}> Enable</label>
                </div>
                ${p !== 'pollinations' ? `<input type="text" class="auth-input prov-key" data-prov="${p}" placeholder="API Key" value="${config.key || ''}">` : '<p style="font-size:0.8em; margin:0;">No API Key required.</p>'}
            `;
            container.appendChild(div);
        });
    }

    // --- GOAL 3 FIX: ACTUALLY LOAD AI MODELS & PAGES FROM DATABASE ---
    function loadAdminSettings() {
        fetch('/api/admin/get_settings').then(r => r.json()).then(d => {
            // Standard Fields
            if(document.getElementById('admin-gemini-key')) document.getElementById('admin-gemini-key').value = d.gemini_api_key || '';
            if(document.getElementById('email-method')) {
                document.getElementById('email-method').value = d.email_method || 'smtp';
                toggleEmailFields();
            }
            if(document.getElementById('smtp-host')) document.getElementById('smtp-host').value = d.smtp_host || '';
            if(document.getElementById('smtp-port')) document.getElementById('smtp-port').value = d.smtp_port || '';
            if(document.getElementById('smtp-user')) document.getElementById('smtp-user').value = d.smtp_user || '';
            if(document.getElementById('smtp-from')) document.getElementById('smtp-from').value = d.smtp_from_email || '';
            if(document.getElementById('email-api-url')) document.getElementById('email-api-url').value = d.email_api_url || '';
            if(document.getElementById('email-api-key')) document.getElementById('email-api-key').value = d.email_api_key || '';
            
            renderImageProviders(d.image_providers_json);

            // CMS Customizations: Provider, Pages, Guidelines
            if(document.getElementById('admin-ai-provider')) {
                document.getElementById('admin-ai-provider').value = d.ai_provider || 'gemini';
            }
            if(document.getElementById('admin-default-pages-json')) {
                document.getElementById('admin-default-pages-json').value = d.default_pages_json || '';
            }
            if(document.getElementById('admin-design-guidelines')) {
                document.getElementById('admin-design-guidelines').value = d.design_guidelines || '';
            }

            // Custom AI Models and Instructions
            const providersList = ['gemini', 'openai', 'claude', 'deepseek', 'grok', 'meta', 'perplexity'];
            providersList.forEach(p => {
                const modEl = document.getElementById('admin-model-' + p);
                const instEl = document.getElementById('admin-inst-' + p);
                if (modEl) modEl.value = d['model_' + p] || '';
                if (instEl) instEl.value = d['inst_' + p] || '';
            });
        }).catch(err => {
            console.error("Error loading Admin settings:", err);
        });
    }

    // --- GOAL 3 FIX: ACTUALLY SAVE AI MODELS & PAGES TO DATABASE ---
    function saveAdminSettings() {
        const geminiKey = document.getElementById('admin-gemini-key') ? document.getElementById('admin-gemini-key').value.trim() : '';
        const emailMethod = document.getElementById('email-method') ? document.getElementById('email-method').value : 'smtp';
        
        const smtpData = {
            email_method: emailMethod,
            smtp_host: document.getElementById('smtp-host') ? document.getElementById('smtp-host').value : '',
            smtp_port: document.getElementById('smtp-port') ? document.getElementById('smtp-port').value : '',
            smtp_user: document.getElementById('smtp-user') ? document.getElementById('smtp-user').value : '',
            smtp_pass: document.getElementById('smtp-pass') ? document.getElementById('smtp-pass').value : '',
            smtp_from_email: document.getElementById('smtp-from') ? document.getElementById('smtp-from').value : '',
            email_api_url: document.getElementById('email-api-url') ? document.getElementById('email-api-url').value : '',
            email_api_key: document.getElementById('email-api-key') ? document.getElementById('email-api-key').value : '',
        };
        
        const provs = {};
        document.querySelectorAll('.prov-enable').forEach(chk => {
            const name = chk.dataset.prov;
            const enabled = chk.checked;
            const keyInput = document.querySelector(`.prov-key[data-prov="${name}"]`);
            const key = keyInput ? keyInput.value : '';
            provs[name] = { enabled, key, type: (name==='pollinations'?'free':'paid') };
        });

        // Collect Custom Models dynamically
        const modelsData = {};
        ['gemini', 'openai', 'claude', 'deepseek', 'grok', 'meta', 'perplexity'].forEach(provider => {
            const modEl = document.getElementById('admin-model-' + provider);
            const instEl = document.getElementById('admin-inst-' + provider);
            if (modEl) modelsData['model_' + provider] = modEl.value.trim();
            if (instEl) modelsData['inst_' + provider] = instEl.value.trim();
        });

        // Collect Pages and Guidelines
        const aiProvider = document.getElementById('admin-ai-provider') ? document.getElementById('admin-ai-provider').value : 'gemini';
        const defaultPagesJson = document.getElementById('admin-default-pages-json') ? document.getElementById('admin-default-pages-json').value.trim() : '';
        const designGuidelines = document.getElementById('admin-design-guidelines') ? document.getElementById('admin-design-guidelines').value.trim() : '';

        const payload = { 
            gemini_api_key: geminiKey,
            image_providers_json: JSON.stringify(provs),
            ai_provider: aiProvider,
            default_pages_json: defaultPagesJson,
            design_guidelines: designGuidelines,
            ...smtpData,
            ...modelsData
        };

        fetch('/api/admin/update_settings', {
            method: 'POST', 
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        })
        .then(r => r.json())
        .then(d => {
            if(d.success || d.message) {
                alert(d.message || "✅ System configuration saved successfully!");
            } else {
                alert("❌ Error saving settings: " + d.error);
            }
        }).catch(err => {
            alert("Network error while saving settings.");
        });
    }

    // --- GOAL 4 FIX: GLOBAL ERROR MODAL LOGIC (Preserved) ---
    function showGenerationError(errorMessage) {
        const statusEl = document.getElementById('status-message');
        if (statusEl) {
            statusEl.innerHTML = `
                <div style="display:flex; align-items:center; color:#dc3545; font-weight:bold;">
                    ❌ Website generation fail. 
                    <a href="#" onclick="openErrorModal(event, \`${encodeURIComponent(errorMessage)}\`)" style="color:#007bff; text-decoration:underline; margin-left:10px;">[Click for Details]</a>
                </div>
            `;
            statusEl.style.backgroundColor = '#f8d7da';
            statusEl.style.borderColor = '#f5c6cb';
        }
    }

    window.openErrorModal = function(e, encodedMsg) {
        e.preventDefault();
        const msg = decodeURIComponent(encodedMsg);
        
        let modal = document.getElementById('generation-error-modal');
        if (!modal) {
            modal = document.createElement('div');
            modal.id = 'generation-error-modal';
            modal.className = 'auth-modal';
            modal.style.display = 'none';
            modal.style.position = 'fixed';
            modal.style.top = '0';
            modal.style.left = '0';
            modal.style.width = '100%';
            modal.style.height = '100%';
            modal.style.background = 'rgba(0,0,0,0.85)';
            modal.style.zIndex = '100000';
            modal.style.justifyContent = 'center';
            modal.style.alignItems = 'center';
            
            modal.innerHTML = `
                <div class="auth-box" style="width: 550px; text-align: left; background: white; border-radius: 8px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">
                        <h2 style="margin: 0; color: #dc3545;">⚠️ Generation Error</h2>
                        <button onclick="document.getElementById('generation-error-modal').style.display='none'" style="background: transparent; border: none; font-size: 1.5em; cursor: pointer; color: #777;">&times;</button>
                    </div>
                    <p style="color:#666; font-size:0.9em; margin-bottom:15px;">The AI encountered a critical error while building your request. This error has been recorded in the Admin CMS Generation Logs.</p>
                    <div id="generation-error-details" style="background: #1e1e1e; padding: 15px; border-radius: 5px; font-family: monospace; font-size: 0.85em; color: #f87171; max-height: 250px; overflow-y: auto; border: 1px solid #333; white-space: pre-wrap; word-break: break-word;">
                    </div>
                    <div style="margin-top: 20px; text-align: right;">
                        <button onclick="document.getElementById('generation-error-modal').style.display='none'" class="auth-btn" style="width: auto; background: #6c757d; padding: 10px 20px;">Close window</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }
        
        document.getElementById('generation-error-details').textContent = msg;
        modal.style.display = 'flex';
    };

    // ==========================================
    // --- GOAL 1 FIX: KEEP-ALIVE PING & SINGLE SESSION ENFORCEMENT ---
    // ==========================================
   setInterval(function() {
        // Pings the backend every 3 seconds to ensure single session validity
        fetch('/api/check_auth', { cache: "no-store" })
            .then(r => {
                if (r.status === 401 || r.status === 403) {
                    handleForcedLogout();
                    return null;
                }
                return r.json();
            })
            .then(data => {
                if (!data) return;
                
                // --- INTEGRATION: LICENSE WARNING DISPLAY ---
                if (data.license_warning) {
                    // Inject a warning banner if one doesn't exist
                    if (!document.getElementById('license-warning-banner')) {
                        const banner = document.createElement('div');
                        banner.id = 'license-warning-banner';
                        banner.style.cssText = 'background:#ffc107; color:#856404; padding:10px; text-align:center; font-weight:bold; z-index:100000; position:fixed; top:0; width:100%; border-bottom:2px solid #e0a800;';
                        banner.innerHTML = `⚠️ ${data.license_warning}`;
                        document.body.prepend(banner);
                        
                        // Add padding to body so the banner doesn't cover content
                        document.body.style.paddingTop = '45px';
                    }
                } else {
                    // Remove if warning cleared
                    const banner = document.getElementById('license-warning-banner');
                    if (banner) {
                        banner.remove();
                        document.body.style.paddingTop = '0px';
                    }
                }
                
                // --- SESSION ENFORCEMENT ---
                if (data.authenticated) {
                    if (currentUser) {
                        // Check if the user ID changed (e.g. logged into a different account on another tab)
                        if (data.id !== undefined && currentUser.id !== data.id) {
                            window.location.replace('/');
                            return;
                        }
                        if (data.websites_generated !== undefined) {
                            currentUser.websites_generated = data.websites_generated;
                        }
                    }
                } else {
                    // Session was killed or user logged out on another device
                    handleForcedLogout();
                }
            })
            .catch(e => console.warn("Keep-alive ping failed. Network might be unstable."));
    }, 3000); 

</script>

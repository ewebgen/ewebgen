<script>
    // =========================================================
    // ADMIN CMS: API KEY REQUESTS MANAGEMENT
    // =========================================================
    
    window.loadAdminApiKeyRequests = function() {
        const tbody = document.getElementById('admin-api-key-reqs-tbody');
        if (!tbody) return;
        
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:20px; color:#888;">Loading requests...</td></tr>';
        
        fetch('/api/admin/api_key_requests')
        .then(r => r.json())
        .then(data => {
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:20px; color:#888;">No API key requests found.</td></tr>';
                return;
            }
            
            data.forEach(req => {
                let statusColor = req.status === 'Completed' ? '#28a745' : (req.status === 'Cancelled' ? '#dc3545' : '#ffc107');
                
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${req.created_at}</td>
                    <td style="font-weight:bold;">${req.user_email}</td>
                    <td>${req.provider}</td>
                    <td>$${req.amount.toFixed(2)}</td>
                    <td style="color:${statusColor}; font-weight:bold;">${req.status}</td>
                    <td style="font-family:monospace; color:#555;">${req.assigned_key ? req.assigned_key.substring(0, 10) + '...' : 'None'}</td>
                    <td>
                        <button onclick="window.openProcessApiKeyModal(${req.id}, '${req.status}', '${req.assigned_key}')" style="background:#007bff; color:#fff; border:none; padding:5px 10px; border-radius:4px; cursor:pointer; font-size:12px;">Process</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        })
        .catch(e => {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:20px; color:red;">Error loading requests.</td></tr>';
        });
    };

    window.openProcessApiKeyModal = function(id, status, assignedKey) {
        document.getElementById('admin-api-req-id').value = id;
        document.getElementById('admin-api-req-status').value = status;
        document.getElementById('admin-api-req-key').value = assignedKey && assignedKey !== 'null' ? assignedKey : '';
        
        document.getElementById('admin-api-key-modal').style.display = 'flex';
    };

    window.saveAdminApiKeyRequest = function() {
        const id = document.getElementById('admin-api-req-id').value;
        const status = document.getElementById('admin-api-req-status').value;
        const key = document.getElementById('admin-api-req-key').value;
        
        if (status === 'Completed' && (!key || key.trim() === '')) {
            alert("You must assign an API Key to mark the request as Completed.");
            return;
        }
        
        const btn = document.querySelector('#admin-api-key-modal .auth-btn:not(.btn-cancel)');
        const origText = btn.textContent;
        btn.textContent = 'Saving...';
        btn.disabled = true;
        
        fetch('/api/admin/api_key_requests/update', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ id: id, status: status, assigned_key: key })
        })
        .then(r => r.json())
        .then(data => {
            btn.textContent = origText;
            btn.disabled = false;
            
            if (data.success) {
                alert("Request processed successfully!");
                document.getElementById('admin-api-key-modal').style.display = 'none';
                window.loadAdminApiKeyRequests(); // Refresh the table
            } else {
                alert("Error: " + data.error);
            }
        })
        .catch(e => {
            btn.textContent = origText;
            btn.disabled = false;
            alert("Network error.");
        });
    };


    // =========================================================
    // GOALS 1 & 2: EXTERNAL STORE REDIRECTS (DOMAIN & HOSTING)
    // =========================================================
    
    window.handleExternalStoreRedirect = function(type, action, details) {
        // 1. Show the required warning popup
        alert("You will now be redirected to our Website service provider website to complete this process.");
        
        // 2. Log the order securely in the backend so it appears in 'My Orders'
        fetch('/api/user/orders/external', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ type: type, action: action, details: details })
        }).catch(e => console.log("Silent error logging external order", e));

        // 3. Redirect to respective URLs
        if (type === 'domain') {
            window.open("https://ordersell.com/domain-registration", "_blank");
        } else if (type === 'hosting') {
            window.open("https://ordersell.com/web-hosting", "_blank");
        }
    };

    // Inject Domain & Hosting UI into the Store Slider dynamically without touching base HTML files
    document.addEventListener('DOMContentLoaded', () => {
        const storeInjectionInterval = setInterval(() => {
            const domainTab = document.getElementById('store-tab-domain');
            const hostingTab = document.getElementById('store-tab-hosting');
            
            if (domainTab && !domainTab.dataset.injected) {
                domainTab.innerHTML = `
                    <h3 style="margin-top:0; color:#333; font-size:18px;">Domain Services</h3>
                    <p style="font-size:13px; color:#666; margin-bottom:15px;">Search, register, or transfer your perfect web address.</p>
                    <div style="display:flex; flex-direction:column; gap:10px; background:#f8f9fa; padding:20px; border-radius:8px; border:1px solid #e2e8f0;">
                        <button class="auth-btn" style="background:#007bff; color:white; font-weight:bold; font-size:14px; padding:12px; box-shadow:0 4px 10px rgba(0,123,255,0.2);" onclick="window.handleExternalStoreRedirect('domain', 'buy', '')">🌐 Buy New Domain</button>
                        <button class="auth-btn" style="background:#28a745; color:white; font-weight:bold; font-size:14px; padding:12px; box-shadow:0 4px 10px rgba(40,167,69,0.2);" onclick="window.handleExternalStoreRedirect('domain', 'renew', '')">🔄 Renew Domain</button>
                        <button class="auth-btn" style="background:#6f42c1; color:white; font-weight:bold; font-size:14px; padding:12px; box-shadow:0 4px 10px rgba(111,66,193,0.2);" onclick="window.handleExternalStoreRedirect('domain', 'transfer', '')">↪️ Transfer Domain</button>
                    </div>
                `;
                domainTab.dataset.injected = 'true';
            }
            
            if (hostingTab && !hostingTab.dataset.injected) {
                hostingTab.innerHTML = `
                    <h3 style="margin-top:0; color:#333; font-size:18px;">Web Hosting</h3>
                    <p style="font-size:13px; color:#666; margin-bottom:15px;">Fast, secure, and reliable cloud hosting for your deployed projects.</p>
                    <div style="display:flex; flex-direction:column; gap:10px; background:#f8f9fa; padding:20px; border-radius:8px; border:1px solid #e2e8f0;">
                        <button class="auth-btn" style="background:#007bff; color:white; font-weight:bold; font-size:14px; padding:12px; box-shadow:0 4px 10px rgba(0,123,255,0.2);" onclick="window.handleExternalStoreRedirect('hosting', 'buy', '')">☁️ Buy Hosting Plan</button>
                        <button class="auth-btn" style="background:#28a745; color:white; font-weight:bold; font-size:14px; padding:12px; box-shadow:0 4px 10px rgba(40,167,69,0.2);" onclick="window.handleExternalStoreRedirect('hosting', 'renew', '')">🔄 Renew Hosting</button>
                    </div>
                `;
                hostingTab.dataset.injected = 'true';
            }
            
            if (domainTab && domainTab.dataset.injected && hostingTab && hostingTab.dataset.injected) {
                clearInterval(storeInjectionInterval);
            }
        }, 1000);

        // Auto-refresh hook to load the Admin Tab when clicked
        setInterval(() => {
            const tab = document.getElementById('tab-api-key-reqs');
            if (tab && tab.style.display === 'block' && !tab.dataset.loaded) {
                window.loadAdminApiKeyRequests();
                tab.dataset.loaded = 'true';
            }
            if (tab && tab.style.display === 'none') {
                tab.dataset.loaded = ''; 
            }
        }, 1000);
    });

    // =========================================================
    // GOAL 2 FIX: UNIFIED "MY ORDERS" TABLE OVERRIDE
    // Consumes backend unified endpoint properly to prevent Network Errors
    // =========================================================
    
    window.openMyOrders = function() {
        const profileMenu = document.getElementById('profile-menu');
        if (profileMenu) profileMenu.style.display = 'none';
        
        const modal = document.getElementById('my-orders-modal');
        if(modal) modal.style.display = 'flex';
        
        const tbody = document.getElementById('my-orders-body');
        if(!tbody) return;
        
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px;">Loading your orders...</td></tr>';
        
        // Fetch from the correct native backend endpoint
        fetch('/api/user/orders')
        .then(r => {
            if(!r.ok) throw new Error("HTTP Status " + r.status);
            return r.json();
        })
        .then(data => {
            if(data.success) {
                tbody.innerHTML = '';
                
                if(!data.orders || data.orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px; color:#666; font-style:italic;">You have not placed any orders yet.</td></tr>';
                    return;
                }
                
                data.orders.forEach(o => {
                    let btnHtml = '';
                    let badge = '';

                    // 1. DETERMINE CORRECT TYPE FROM BACKEND STRUCTURE
                    let oType = 'plan';
                    if (o.id && String(o.id).startsWith('API-')) oType = 'api_key';
                    else if (o.is_external) oType = 'external';

                    let renewType = o.product_name && o.product_name.toLowerCase().includes('domain') ? 'domain' : 'hosting';
                    let oDate = o.created_at || o.date || 'Unknown';

                    // 2. FORMAT BADGES
                    if (o.status === 'active' || o.status === 'completed') {
                        badge = `<span class="badge badge-success" style="padding:4px 8px; border-radius:12px; background:#e8f5e9; color:#1b5e20; font-size:11px; font-weight:bold; letter-spacing:0.5px;">${o.status.toUpperCase()}</span>`;
                    } else if (o.status === 'cancelled' || o.status === 'failed') {
                        badge = `<span class="badge badge-danger" style="padding:4px 8px; border-radius:12px; background:#ffebee; color:#b71c1c; font-size:11px; font-weight:bold; letter-spacing:0.5px;">${o.status.toUpperCase()}</span>`;
                    } else if (o.status === 'expired') {
                        badge = `<span class="badge badge-secondary" style="padding:4px 8px; border-radius:12px; background:#f5f5f5; color:#616161; font-size:11px; font-weight:bold; letter-spacing:0.5px;">EXPIRED</span>`;
                    } else {
                        // Pending / Pending Configuration
                        badge = `<span class="badge badge-warning" style="padding:4px 8px; border-radius:12px; background:#fff3cd; color:#856404; font-size:11px; font-weight:bold; letter-spacing:0.5px;">${o.status.toUpperCase()}</span>`;
                    }
                    
                    // 3. FORMAT ACTION BUTTONS BY TYPE
                    if (oType === 'plan') {
                        if(o.status === 'active') {
                            btnHtml = `<button onclick="cancelUserOrder(${o.id})" style="background:#dc3545; color:white; border:none; padding:6px 12px; border-radius:4px; font-size:12px; font-weight:bold; cursor:pointer; transition:0.2s;">Cancel</button>`;
                        } else if (o.status === 'expired' || o.status === 'cancelled') {
                            btnHtml = `<button onclick="document.getElementById('my-orders-modal').style.display='none'; if(typeof openPlanSelectionModal === 'function') openPlanSelectionModal();" style="background:#28a745; color:white; border:none; padding:6px 12px; border-radius:4px; font-size:12px; font-weight:bold; cursor:pointer; transition:0.2s;">Renew</button>`;
                        }
                    } 
                    else if (oType === 'external') {
                        // Redirect to the external provider for domain/hosting renewals
                        btnHtml = `<button onclick="window.handleExternalStoreRedirect('${renewType}', 'renew', '')" style="background:#17a2b8; color:white; border:none; padding:6px 12px; border-radius:4px; font-size:12px; font-weight:bold; cursor:pointer; transition:0.2s;">Manage / Renew</button>`;
                    } 
                    else if (oType === 'api_key') {
                        if (o.status === 'completed' && o.assigned_key) {
                            // If fulfilled, show the copy key button
                            btnHtml = `<div style="display:flex; align-items:center; gap:5px;"><input type="password" value="${o.assigned_key}" readonly style="width:80px; padding:4px; font-size:10px; border:1px solid #ccc; border-radius:3px;" id="copy-key-${o.id}"><button onclick="const k = document.getElementById('copy-key-${o.id}'); k.type='text'; navigator.clipboard.writeText(k.value); alert('API Key copied to clipboard!'); setTimeout(()=>{k.type='password'}, 1500);" style="background:#007bff; color:white; border:none; padding:5px 8px; border-radius:4px; cursor:pointer; font-size:11px; font-weight:bold;" title="Copy to Clipboard">Copy</button></div>`;
                        } else {
                            btnHtml = `<span style="font-size:11px; color:#888; font-style:italic;">Reviewing...</span>`;
                        }
                    }
                    
                    // 4. FORMAT PRICING
                    let priceDisplay = (o.price !== undefined && o.price !== null && o.price > 0) ? `${o.price} ${o.currency || 'USD'}` : '-';
                    if (oType === 'external') priceDisplay = '<span style="font-size:11px; color:#666;">External</span>';

                    // 5. RENDER ROW
                    tbody.innerHTML += `
                        <tr style="border-bottom:1px solid #eee;">
                            <td style="padding:12px 10px; font-size:12px; color:#666;">${o.id}</td>
                            <td style="padding:12px 10px;"><strong>${o.product_name}</strong></td>
                            <td style="padding:12px 10px; font-size:13px; font-weight:600; color:#444;">${priceDisplay}</td>
                            <td style="padding:12px 10px;">${badge}</td>
                            <td style="padding:12px 10px; font-size:12px; color:#555;">${oDate}</td>
                            <td style="padding:12px 10px;">${btnHtml}</td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px; color:red;">Failed to load orders.</td></tr>';
            }
        }).catch((e) => {
            console.error("Order fetch error: ", e);
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px; color:red;">Network error. Could not load orders.</td></tr>';
        });
    };
</script>

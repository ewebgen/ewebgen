    window.currentAppLanguage = localStorage.getItem('appLanguage') || 'en';

    window.translateUI = function() {
        const dict = window.appTranslations[window.currentAppLanguage] || window.appTranslations['en'];
        
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (dict[key]) {
                const targetSpan = el.querySelector('.btn-text, .nav-text, .lbl-text');
                if (targetSpan) {
                    targetSpan.innerHTML = dict[key];
                } 
                else if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                    el.placeholder = dict[key];
                } 
                else {
                    let hasIcon = el.querySelector('.icon') !== null;
                    if (!hasIcon) {
                        el.innerHTML = dict[key];
                    }
                }
            }
        });
    };

    window.changeAppLanguage = function(lang) {
        window.currentAppLanguage = lang;
        localStorage.setItem('appLanguage', lang);
        
        const langSelect = document.getElementById('app-language-select');
        if (langSelect) langSelect.value = lang;

        window.translateUI();
        
        if (typeof currentUser !== 'undefined' && currentUser && currentUser.id) {
            fetch('/api/update_language', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ language: lang })
            }).catch(e => console.error("Could not sync language to backend", e));
        }
    };

    document.addEventListener("DOMContentLoaded", () => {
        window.translateUI();
        
        const observer = new MutationObserver((mutations) => {
            let shouldTranslate = false;
            for (let m of mutations) {
                if (m.addedNodes.length > 0 || m.attributeName === 'style' || m.attributeName === 'class') {
                    shouldTranslate = true;
                    break;
                }
            }
            if (shouldTranslate) {
                clearTimeout(window._i18nThrottle);
                window._i18nThrottle = setTimeout(window.translateUI, 50);
            }
        });
        
        observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] });
    });

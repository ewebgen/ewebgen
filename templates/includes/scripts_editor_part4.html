<script>
    // ==========================================
    // 1. GLOBAL MEDIA CONTEXT (Tracks where Media Manager selections should go)
    // ==========================================
    window.currentMediaContext = 'image'; 

    function openImageManager(context = 'image') {
        window.currentMediaContext = context;
        document.getElementById('image-manager-modal').style.display = 'flex';
        
        const searchInput = document.getElementById('img-search-query');
        if (searchInput && !searchInput.hasAttribute('data-enter-bound')) {
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') { e.preventDefault(); searchWebImages(); }
            });
            searchInput.setAttribute('data-enter-bound', 'true');
        }
        
        fetch('/api/gallery').then(r => r.json()).then(data => {
            if(data.success) { 
                galleryImages = data.images || []; 
                window.galleryVideos = data.videos || []; 
                renderGallery(galleryImages, 'gallery-grid', 'image'); 
                renderGallery(window.galleryVideos, 'gallery-video-grid', 'video');
            } 
            else { 
                renderGallery([], 'gallery-grid', 'image'); 
                renderGallery([], 'gallery-video-grid', 'video');
            }
        }).catch(() => {
            renderGallery([], 'gallery-grid', 'image');
            renderGallery([], 'gallery-video-grid', 'video');
        });
            
        switchImgTab('gallery');
        switchGallerySubTab('my-images');
        selectedImageSrc = null;
        updateInsertButtonState();
        
        const previewBox = document.getElementById('ai-preview-box');
        if(previewBox) {
            previewBox.innerHTML = `<div style="color:#aaa; text-align:center;">Generated image will appear here.<br><span style="font-size:3em; display:block; margin-top:10px;">🖼️</span></div>`;
        }
        document.getElementById('ai-action-buttons').style.display = 'none';
        document.getElementById('ai-progress-container').style.display = 'none';

        const uploadInput = document.getElementById('local-img-upload') || document.getElementById('image-upload-input');
        if (uploadInput) {
            uploadInput.setAttribute('accept', 'image/*,video/mp4,video/webm,video/ogg,video/quicktime');
        }
    }

    function closeImageManager() {
        document.getElementById('image-manager-modal').style.display = 'none';
        if (!selectedImageSrc) {
            currentImageToReplace = null;
            currentBgElementToReplace = null;
            pendingImageInsert = false;
            window.pendingImageInsert = false;
            window.pendingLogoInsert = false; 
        }
        // Reopen previously active modal if user cancelled out of the Media Manager
        if (window.currentMediaContext === 'video') {
            const vidModal = document.getElementById('edit-video-modal');
            if(vidModal) vidModal.style.display = 'flex';
        } else if (window.currentMediaContext === 'carousel') {
            const carModal = document.getElementById('edit-carousel-modal');
            if(carModal) carModal.style.display = 'flex';
        }
        window.currentMediaContext = 'image'; 
        window.__isAddingImage = false;
    }

    function insertImageInDoc(doc) {
        pendingImageInsert = true;
        window.pendingImageInsert = true; 
        openImageManager('image');
    }

    function switchImgTab(tabId) {
        document.querySelectorAll('.img-tab').forEach(t => t.classList.remove('active'));
        const targetBtn = document.getElementById(`tab-btn-${tabId}`);
        if(targetBtn) targetBtn.classList.add('active');
        document.querySelectorAll('.img-tab-content').forEach(c => c.style.display = 'none');
        const targetTab = document.getElementById(`img-tab-${tabId}`);
        if(targetTab) targetTab.style.display = 'block';
    }

    let currentProjectImagePage = 1;
    let isFetchingProjectImages = false;
    let hasMoreProjectImages = true;

    function switchGallerySubTab(subTabId) {
        document.querySelectorAll('.sub-img-tab').forEach(t => t.classList.remove('active'));
        const activeTab = document.getElementById(`sub-tab-${subTabId}`);
        if(activeTab) activeTab.classList.add('active');
        
        const myImages = document.getElementById('gallery-sub-my-images');
        const myVideos = document.getElementById('gallery-sub-my-videos');
        const projectImages = document.getElementById('gallery-sub-project-images');
        
        if (myImages) myImages.style.display = 'none';
        if (myVideos) myVideos.style.display = 'none';
        if (projectImages) projectImages.style.display = 'none';

        if (subTabId === 'my-images' && myImages) {
            myImages.style.display = 'block';
        } else if (subTabId === 'my-videos' && myVideos) {
            myVideos.style.display = 'block';
        } else if (projectImages) {
            projectImages.style.display = 'block';
            if (currentProjectImagePage === 1 && !isFetchingProjectImages) loadProjectImages(1);
        }
    }

    function loadProjectImages(page) {
        if (isFetchingProjectImages || (!hasMoreProjectImages && page !== 1)) return;
        isFetchingProjectImages = true;
        const grid = document.getElementById('project-images-grid');
        const loadMoreDiv = document.getElementById('project-images-load-more');
        if(!grid) return;
        
        if (page === 1) {
            grid.innerHTML = '<div style="text-align:center; color:#999; padding:20px; grid-column:1/-1;">Loading project images...</div>';
            currentProjectImagePage = 1;
        } else if(loadMoreDiv) {
            loadMoreDiv.innerHTML = '<button class="auth-btn" style="width:auto; background:#6c757d;" disabled>Loading...</button>';
        }

        fetch(`/api/project_images?page=${page}`).then(r => r.json()).then(data => {
            isFetchingProjectImages = false;
            if (data.success) {
                if (page === 1) grid.innerHTML = '';
                if (data.images.length === 0 && page === 1) {
                    grid.innerHTML = '<div style="text-align:center; color:#999; padding:20px; grid-column:1/-1;">No external images found in your projects.</div>';
                    if(loadMoreDiv) loadMoreDiv.style.display = 'none';
                    return;
                }
                data.images.forEach(src => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    const img = document.createElement('img');
                    
                    // PERFORMANCE FIX: Use Thumbnail API + Lazy Loading
                    img.src = `/api/thumbnail?url=${encodeURIComponent(src)}`;
                    img.loading = "lazy";
                    
                    img.onerror = function() { item.remove(); };
                    item.appendChild(img);
                    
                    // Provide the full-resolution URL to the selection function
                    item.onclick = () => selectGalleryImage(item, src);
                    grid.appendChild(item);
                });
                hasMoreProjectImages = data.has_more;
                if (hasMoreProjectImages && loadMoreDiv) {
                    loadMoreDiv.style.display = 'block';
                    loadMoreDiv.style.paddingBottom = '30px'; 
                    loadMoreDiv.innerHTML = '<button class="auth-btn" style="width:auto; background:#007bff; padding:10px 25px; margin-bottom: 20px; box-shadow:0 4px 10px rgba(0,0,0,0.1);" onclick="loadProjectImages(currentProjectImagePage + 1)">Load More Project Images</button>';
                } else if(loadMoreDiv) {
                    loadMoreDiv.style.display = 'none';
                }
            } else {
                if (page === 1) grid.innerHTML = '<div style="color:red; grid-column:1/-1;">Error loading images.</div>';
                if(loadMoreDiv) loadMoreDiv.innerHTML = '<button class="auth-btn" style="width:auto; background:#6c757d;" onclick="loadProjectImages(currentProjectImagePage)">Retry</button>';
            }
        }).catch(err => {
            isFetchingProjectImages = false;
            if(loadMoreDiv) loadMoreDiv.innerHTML = '<button class="auth-btn" style="width:auto; background:#6c757d;" onclick="loadProjectImages(currentProjectImagePage)">Retry</button>';
        });
    }

    function renderGallery(mediaList, targetGridId = 'gallery-grid', mediaType = 'image') {
        const grid = document.getElementById(targetGridId);
        if (!grid) return;
        
        grid.innerHTML = '';
        if (!mediaList || mediaList.length === 0) { 
            grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:20px; color:#999;">No ${mediaType}s found.</div>`; 
            return; 
        }

        mediaList.forEach(src => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            
            if (mediaType === 'video') {
                const vid = document.createElement('video');
                vid.src = src;
                vid.style.width = '100%';
                vid.style.height = '100%';
                vid.style.objectFit = 'cover';
                vid.controls = false;
                
                // PERFORMANCE FIX: Preload none to save bandwidth on large video galleries
                vid.preload = 'none';
                
                vid.onmouseenter = () => vid.play().catch(()=>{});
                vid.onmouseleave = () => { vid.pause(); vid.currentTime = 0; };
                vid.onerror = function() { item.remove(); };
                item.appendChild(vid);
                
                const icon = document.createElement('div');
                icon.innerHTML = '🎥';
                icon.style.cssText = 'position:absolute; bottom:5px; left:5px; background:rgba(0,0,0,0.6); color:white; padding:2px 5px; border-radius:3px; font-size:12px;';
                item.appendChild(icon);
            } else {
                const img = document.createElement('img');
                
                // PERFORMANCE FIX: Use Thumbnail API + Lazy Loading
                img.src = `/api/thumbnail?url=${encodeURIComponent(src)}`;
                img.loading = "lazy";
                
                img.onerror = function() { item.remove(); };
                item.appendChild(img);
            }
            
            if(targetGridId === 'gallery-grid' || targetGridId === 'gallery-video-grid') {
                const delBtn = document.createElement('div');
                delBtn.className = 'gallery-delete-btn';
                delBtn.innerHTML = '✕';
                delBtn.title = `Delete ${mediaType}`;
                delBtn.onclick = (e) => { e.stopPropagation(); deleteGalleryMedia(src, mediaType); };
                item.appendChild(delBtn);
                
                // Ensure FULL RESOLUTION source is passed for canvas insertion
                item.onclick = () => selectGalleryImage(item, src);
            } else if(targetGridId === 'search-results-grid') {
                item.onclick = () => saveWebImage(src);
            }
            grid.appendChild(item);
        });
    }

    function deleteGalleryMedia(src, type = 'image') {
        if(!confirm(`Permanently delete this ${type}?`)) return;
        const filename = src.split('/').pop();
        fetch('/api/delete_image', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ filename: filename }) })
        .then(r => r.json()).then(data => { 
            if(data.success) { 
                if(type === 'video') {
                    window.galleryVideos = window.galleryVideos.filter(vid => vid !== src); 
                    renderGallery(window.galleryVideos, 'gallery-video-grid', 'video');
                } else {
                    galleryImages = galleryImages.filter(img => img !== src); 
                    renderGallery(galleryImages, 'gallery-grid', 'image'); 
                }
            } else { alert("Failed to delete: " + data.error); } 
        });
    }

    function deleteGalleryImage(src) {
        deleteGalleryMedia(src, 'image');
    }

    function saveWebImage(url) {
        const status = document.getElementById('img-selected-status');
        if(status) { status.textContent = "Downloading image..."; status.style.color = "#007bff"; }
        fetch('/api/save_web_image', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ url: url }) })
        .then(r => r.json()).then(data => {
            if(data.success) {
                galleryImages.unshift(data.url); renderGallery(galleryImages, 'gallery-grid', 'image'); switchImgTab('gallery'); switchGallerySubTab('my-images');
                setTimeout(() => { const grid = document.getElementById('gallery-grid'); if(grid && grid.firstChild) grid.firstChild.click(); }, 100);
                if(status) { status.textContent = "Image saved to Gallery"; status.style.color = "green"; }
            } else { 
                alert("Failed to save image: " + data.error); 
                if(status) { status.textContent = "Error saving image"; status.style.color = "red"; }
            }
        });
    }

    function selectGalleryImage(element, src) {
        document.querySelectorAll('.gallery-item').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
        selectedImageSrc = src;
        updateInsertButtonState();
    }

    function selectGeneratedImage() {
        if(generatedImageBlobUrl) { selectedImageSrc = generatedImageBlobUrl; insertSelectedImage(); }
    }

    function updateInsertButtonState() {
        const btn = document.getElementById('btn-insert-img');
        const status = document.getElementById('img-selected-status');
        if (selectedImageSrc) {
            if(btn) { btn.disabled = false; btn.style.opacity = '1'; btn.style.cursor = 'pointer'; }
            if(status) { status.textContent = 'Media selected'; status.style.color = '#28a745'; }
        } else {
            if(btn) { btn.disabled = true; btn.style.opacity = '0.6'; btn.style.cursor = 'not-allowed'; }
            if(status) { status.textContent = 'No media selected'; status.style.color = '#666'; }
        }
    }

    function handleLocalUpload(input) {
        const files = Array.from(input.files);
        if(files.length === 0) return;
        const file = files[0];
        const isVideo = file.type.startsWith('video/');

        const formData = new FormData();
        formData.append('file', file);

        let statusEl = document.getElementById('upload-progress-container');
        if (!statusEl) {
            const container = isVideo ? document.getElementById('gallery-video-grid') : document.getElementById('gallery-grid');
            if (container) {
                container.insertAdjacentHTML('afterbegin', `
                    <div id="upload-progress-container" style="grid-column:1/-1; padding:15px; background:#f8f9fa; border:1px solid #ddd; border-radius:5px; margin-bottom:15px;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                            <span id="upload-progress-text" style="font-size:13px; font-weight:bold; color:#007bff;">Uploading Media...</span>
                            <span id="upload-progress-percent" style="font-size:13px; color:#555;">0%</span>
                        </div>
                        <div style="width:100%; background:#e9ecef; height:8px; border-radius:4px; overflow:hidden;">
                            <div id="upload-progress-bar" style="width:0%; height:100%; background:#28a745; transition:width 0.2s;"></div>
                        </div>
                    </div>
                `);
            }
        }

        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/upload_image', true);
        
        xhr.upload.onprogress = function(e) {
            if (e.lengthComputable) {
                const percentComplete = Math.round((e.loaded / e.total) * 100);
                const bar = document.getElementById('upload-progress-bar');
                const pct = document.getElementById('upload-progress-percent');
                if (bar) bar.style.width = percentComplete + '%';
                if (pct) pct.textContent = percentComplete + '%';
            }
        };

        xhr.onload = function() {
            const progressContainer = document.getElementById('upload-progress-container');
            if (progressContainer) progressContainer.remove();

            if (xhr.status === 200) {
                try {
                    const data = JSON.parse(xhr.responseText);
                    if(data.success) {
                        if(isVideo) {
                            if (typeof window.galleryVideos === 'undefined') window.galleryVideos = [];
                            window.galleryVideos.unshift(data.url); 
                            renderGallery(window.galleryVideos, 'gallery-video-grid', 'video');
                            switchGallerySubTab('my-videos');
                            setTimeout(() => { const grid = document.getElementById('gallery-video-grid'); if(grid && grid.firstChild) grid.firstChild.click(); }, 100);
                        } else {
                            galleryImages.unshift(data.url); 
                            renderGallery(galleryImages, 'gallery-grid', 'image');
                            switchGallerySubTab('my-images');
                            setTimeout(() => { const grid = document.getElementById('gallery-grid'); if(grid && grid.firstChild) grid.firstChild.click(); }, 100);
                        }
                    } else {
                        alert("Upload failed: " + data.error);
                    }
                } catch(e) {
                    alert("Invalid server response.");
                }
            } else {
                alert("Upload failed with status: " + xhr.status);
            }
        };

        xhr.onerror = function() {
            const progressContainer = document.getElementById('upload-progress-container');
            if (progressContainer) progressContainer.remove();
            alert("Network error occurred during upload.");
        };

        xhr.send(formData);
        input.value = ''; 
    }

    function generateAiImage() {
        const prompt = document.getElementById('ai-img-prompt').value.trim();
        if(!prompt) { alert("Please enter a description."); return; }
        
        const typeElem = document.querySelector('input[name="ai-gen-type"]:checked');
        const type = typeElem ? typeElem.value : 'image';
        
        const logoTextElem = document.getElementById('ai-logo-text');
        const logoText = logoTextElem ? logoTextElem.value.trim() : '';
        
        const btn = document.getElementById('btn-gen-ai');
        if(btn) btn.disabled = true;
        
        const progressContainer = document.getElementById('ai-progress-container');
        const progressBar = document.getElementById('ai-progress-bar');
        const statusText = document.getElementById('ai-status-text');
        
        if(progressContainer) progressContainer.style.display = 'block'; 
        if(progressBar) progressBar.style.width = '0%'; 
        if(statusText) statusText.textContent = "Initializing AI model...";
        
        let progress = 0;
        const interval = setInterval(() => {
            if(progress < 90) {
                progress += Math.random() * 5;
                if(progressBar) progressBar.style.width = Math.min(progress, 90) + '%';
                if(statusText) {
                    if(progress > 20 && progress < 50) statusText.textContent = "Processing prompt...";
                    else if(progress >= 50 && progress < 80) statusText.textContent = "Rendering image...";
                }
            }
        }, 300);

        fetch('/api/generate_image', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ prompt: prompt, type: type, text: logoText })
        }).then(r => r.json()).then(data => {
            clearInterval(interval); 
            if(progressBar) progressBar.style.width = '100%'; 
            if(btn) btn.disabled = false;
            
            if(data.success && data.images && data.images.length > 0) {
                if(statusText) statusText.textContent = "Generation complete!";
                const imgUrl = data.images[0]; 
                generatedImageBlobUrl = imgUrl; 
                const previewBox = document.getElementById('ai-preview-box'); 
                if(previewBox) {
                    previewBox.innerHTML = '';
                    const img = document.createElement('img'); 
                    img.src = imgUrl;
                    img.onload = () => { setTimeout(() => { if(progressContainer) progressContainer.style.display = 'none'; }, 1000); };
                    previewBox.appendChild(img);
                }
                const actionBtns = document.getElementById('ai-action-buttons');
                if(actionBtns) actionBtns.style.display = 'flex';
                galleryImages.unshift(imgUrl);
            } else {
                if(statusText) {
                    statusText.textContent = "Error: " + (data.error || 'Unknown error');
                    statusText.style.color = 'red';
                }
            }
        }).catch(err => {
            clearInterval(interval);
            if(btn) btn.disabled = false;
            if(statusText) { statusText.textContent = "Network Error."; statusText.style.color = 'red'; }
        });
    }

    function searchWebImages() {
        const searchInput = document.getElementById('img-search-query');
        const query = searchInput ? searchInput.value.trim() : '';
        if(!query) { alert("Please enter a search term."); return; }
        
        const grid = document.getElementById('search-results-grid');
        if(!grid) return;
        
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#666;">Searching...</div>';
        fetch(`/api/search_images?q=${encodeURIComponent(query)}`).then(r => r.json()).then(data => {
            if(data.success && data.images) { renderGallery(data.images, 'search-results-grid', 'image'); } 
            else { grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:red;">No results found.</div>`; }
        });
    }

    // ========================================================
    // 2. SMART MEDIA ROUTER (Handles Modal Inject vs Canvas Inject)
    // ========================================================
    const confirmImageSelection = insertSelectedImage;

    // --- SMART LOGO INJECTION HELPER ---
    window.insertLogoToCanvas = function(imgSrc) {
        const iframe = document.getElementById('preview-frame');
        if (!iframe) return;
        const doc = iframe.contentDocument || iframe.contentWindow.document;

        if(typeof captureState === 'function') captureState();
        
        const el = doc.createElement('img'); 
        el.src = imgSrc; 
        el.style.width = '200px'; 
        el.style.height = '70px';
        el.style.objectFit = 'contain';
        el.style.maxWidth = '100%'; 

        if (window.currentContextTarget) {
            let target = window.currentContextTarget;
            
            // SMART LOGO DETECTION
            let brandContainer = target.closest('.navbar-brand, .logo, .site-logo, .brand, .site-title, .header-logo');

            if (!brandContainer) {
                const header = target.closest('header, nav, .navbar');
                if (header) {
                    brandContainer = header.querySelector('.navbar-brand, .logo, .site-logo, .brand, .site-title, .header-logo');
                    if (!brandContainer) {
                        const firstLink = header.querySelector('a:not(.nav-link)');
                        if (firstLink) brandContainer = firstLink;
                    }
                }
            }

            if (brandContainer) {
                const existingImg = brandContainer.tagName === 'IMG' ? brandContainer : brandContainer.querySelector('img');
                if (existingImg) {
                    existingImg.src = imgSrc;
                    existingImg.style.width = '200px';
                    existingImg.style.height = '70px';
                    existingImg.style.objectFit = 'contain';
                } else {
                    brandContainer.innerHTML = '';
                    brandContainer.style.display = 'inline-flex';
                    brandContainer.style.alignItems = 'center';
                    brandContainer.appendChild(el);
                }
            } else {
                if(target.tagName === 'BODY' || target.tagName === 'HTML' || target.classList.contains('eweb-column') || target.classList.contains('eweb-block')) {
                    target.appendChild(el);
                } else if(target.nextSibling) {
                    target.parentNode.insertBefore(el, target.nextSibling);
                } else {
                    target.parentNode.appendChild(el);
                }
            }
            
            window.currentContextTarget = null;
        } else {
            const sel = doc.getSelection();
            if (sel.rangeCount > 0 && !sel.getRangeAt(0).collapsed) { 
                const range = sel.getRangeAt(0); 
                range.deleteContents(); 
                range.insertNode(el); 
            } else if (sel.rangeCount > 0) { 
                sel.getRangeAt(0).insertNode(el); 
            } else { 
                doc.body.appendChild(el); 
            }
        }
        
        if(typeof initEditor === 'function') initEditor(iframe); 
        window.pendingLogoInsert = false; 
        if(typeof updateStatus === 'function') updateStatus('Logo safely inserted.'); 
        if(typeof enableSaveButton === 'function') enableSaveButton(); 
        if(typeof captureState === 'function') captureState();
        
        closeImageManager();
    };

    function insertSelectedImage() {
        if (!selectedImageSrc) return;
        
        // --- NEW: Intercept for Logo Requests ---
        if (window.currentMediaContext === 'logo_insert' || window.pendingLogoInsert || window.currentMediaContext === 'global_logo') {
            const context = window.currentMediaContext === 'global_logo' ? 'global_logo' : 'logo_insert';
            const mgrModal = document.getElementById('image-manager-modal');
            if(mgrModal) mgrModal.style.display = 'none';

            if (typeof window.openImageEditorModal === 'function') {
                window.openImageEditorModal(selectedImageSrc, function(editedImageSrc) {
                    if(editedImageSrc.startsWith('data:image')) {
                        if (typeof window.uploadBase64AndApplyLogo === 'function') {
                            window.uploadBase64AndApplyLogo(editedImageSrc, context);
                        }
                    } else {
                        if (context === 'global_logo') {
                            if (typeof window.applyGlobalLogo === 'function') window.applyGlobalLogo(editedImageSrc);
                        } else {
                            if (typeof window.insertLogoToCanvas === 'function') window.insertLogoToCanvas(editedImageSrc);
                        }
                    }
                });
            } else {
                if (context === 'global_logo') {
                    if (typeof window.applyGlobalLogo === 'function') window.applyGlobalLogo(selectedImageSrc);
                } else {
                    if (typeof window.insertLogoToCanvas === 'function') window.insertLogoToCanvas(selectedImageSrc);
                }
            }
            window.currentMediaContext = 'image';
            window.pendingLogoInsert = false;
            return;
        }
        
        if (window.currentMediaContext === 'video') {
            const urlInput = document.getElementById('edit-video-file-url');
            if (urlInput) urlInput.value = selectedImageSrc;
            
            const typeSelect = document.getElementById('edit-video-type-select');
            if (typeSelect) {
                typeSelect.value = 'file';
                if(typeof window.toggleVideoInputType === 'function') window.toggleVideoInputType();
            }
            
            const mgrModal = document.getElementById('image-manager-modal');
            if(mgrModal) mgrModal.style.display = 'none';
            
            const vidModal = document.getElementById('edit-video-modal');
            if(vidModal) vidModal.style.display = 'flex';
            
            window.currentMediaContext = 'image'; 
            return;
        }
        
        if (window.currentMediaContext === 'carousel') {
            const mgrModal = document.getElementById('image-manager-modal');
            if(mgrModal) mgrModal.style.display = 'none';
            
            if (typeof window.addCarouselImageRow === 'function') {
                window.addCarouselImageRow(selectedImageSrc);
            }
            
            const carModal = document.getElementById('edit-carousel-modal');
            if(carModal) carModal.style.display = 'flex';
            
            window.currentMediaContext = 'image';
            return;
        }
        
        if (window.__isAddingImage) {
            if(typeof captureState === 'function') captureState();
            const widgetHtml = `<div class="eweb-image-widget eweb-block" style="text-align:center; padding:10px;"><img src="${selectedImageSrc}" style="max-width:100%; height:auto; border-radius:8px;"></div>`;
            if (typeof window.finalizeInlineWidgetInsertion === 'function') {
                window.finalizeInlineWidgetInsertion(widgetHtml);
            } else if (typeof window.injectWidgetIntoEditor === 'function') {
                window.injectWidgetIntoEditor(widgetHtml);
            }
            window.__isAddingImage = false;
            closeImageManager();
            return;
        }

        const iframe = document.getElementById('preview-frame');
        if (!iframe) return;
        const doc = iframe.contentDocument || iframe.contentWindow.document;

        const isVideo = selectedImageSrc.match(/\.(mp4|webm|ogg|mov)$/i);

        if (currentImageToReplace) {
            if(typeof captureState === 'function') captureState(); 
            if(isVideo && currentImageToReplace.tagName !== 'VIDEO') {
                const vid = doc.createElement('video');
                vid.src = selectedImageSrc;
                vid.controls = true;
                vid.style.cssText = currentImageToReplace.style.cssText;
                vid.className = currentImageToReplace.className;
                currentImageToReplace.parentNode.replaceChild(vid, currentImageToReplace);
            } else {
                currentImageToReplace.src = selectedImageSrc; 
            }
            currentImageToReplace = null;
            if(typeof updateStatus === 'function') updateStatus('Media replaced.'); 
            if(typeof enableSaveButton === 'function') enableSaveButton(); 
            if(typeof captureState === 'function') captureState();
        } else if (currentBgElementToReplace) {
            if(typeof captureState === 'function') captureState(); 
            currentBgElementToReplace.style.backgroundImage = `url('${selectedImageSrc}')`;
            currentBgElementToReplace.style.backgroundSize = 'cover'; 
            currentBgElementToReplace.style.backgroundPosition = 'center';
            currentBgElementToReplace = null; 
            if(typeof updateStatus === 'function') updateStatus('Background updated.'); 
            if(typeof enableSaveButton === 'function') enableSaveButton(); 
            if(typeof captureState === 'function') captureState();
        } else if (pendingImageInsert || window.pendingImageInsert) {
            if(typeof captureState === 'function') captureState(); 
            let el;
            if (isVideo) {
                el = doc.createElement('video');
                el.src = selectedImageSrc;
                el.controls = true;
                el.style.width = '300px';
            } else {
                el = doc.createElement('img'); 
                el.src = selectedImageSrc; 
                el.style.width = '300px'; 
            }

            if (window.currentContextTarget) {
                if(window.currentContextTarget.tagName === 'BODY' || window.currentContextTarget.tagName === 'HTML' || window.currentContextTarget.classList.contains('eweb-column') || window.currentContextTarget.classList.contains('eweb-block')) {
                    window.currentContextTarget.appendChild(el);
                } else if(window.currentContextTarget.nextSibling) {
                    window.currentContextTarget.parentNode.insertBefore(el, window.currentContextTarget.nextSibling);
                } else {
                    window.currentContextTarget.parentNode.appendChild(el);
                }
                window.currentContextTarget = null;
            } else {
                const sel = doc.getSelection();
                if (sel.rangeCount > 0 && !sel.getRangeAt(0).collapsed) { 
                    const range = sel.getRangeAt(0); 
                    range.deleteContents(); 
                    range.insertNode(el); 
                } else if (sel.rangeCount > 0) { 
                    sel.getRangeAt(0).insertNode(el); 
                } else { 
                    doc.body.appendChild(el); 
                }
            }
            if(typeof initEditor === 'function') initEditor(iframe); 
            pendingImageInsert = false; 
            window.pendingImageInsert = false;
            if(typeof updateStatus === 'function') updateStatus('Media inserted.'); 
            if(typeof enableSaveButton === 'function') enableSaveButton(); 
            if(typeof captureState === 'function') captureState();
        }
        closeImageManager();
    }

                        const closeBtn = document.createElement('button'); closeBtn.className = 'eweb-drawer-close'; closeBtn.innerHTML = '✕'; closeBtn.onclick = () => drawer.classList.remove('open'); drawer.appendChild(closeBtn);
                        const header = e.target.closest('header, .navbar, .nav-container') || document.querySelector('header');
                        const nav = header ? (header.querySelector('nav') || header.querySelector('ul') || header.querySelector('.nav-links')) : null;
                        if (nav) {
                            const links = nav.querySelectorAll('a');
                            links.forEach(l => { const clone = l.cloneNode(true); clone.onclick = () => drawer.classList.remove('open'); drawer.appendChild(clone); });

                            if (bg === 'rgba(0, 0, 0, 0)' || bg === 'transparent') bg = '#ffffff';

        let style = doc.getElementById(styleId);

                        let scriptEl = parsedDoc.createElement('script');
                        scriptEl.id = scriptId;
                        scriptEl.innerHTML = responsiveJS;
                        parsedDoc.body.appendChild(scriptEl);
                        modified = true;
                    }

                    const targetHeaders = parsedDoc.querySelectorAll('header, .navbar, .nav-container');
                    targetHeaders.forEach(targetHeader => {
                        const targetNav = targetHeader.querySelector('nav') || targetHeader.querySelector('ul') || targetHeader.querySelector('.nav-links');
                        if (targetNav) {
                            let targetBtn = targetHeader.querySelector('.eweb-hamburger');
                            if (!targetBtn) {
                                const targetNativeBurger = targetHeader.querySelector('.hamburger, .menu-toggle, .navbar-toggler, [class*="hamburger"], [class*="mobile-menu"], [id*="hamburger"]');
                                if (targetNativeBurger) {
                                    targetNativeBurger.classList.add('eweb-hamburger');
                                    modified = true;
                                } else {
                                    targetBtn = parsedDoc.createElement('button');
                                    targetBtn.className = 'eweb-hamburger';
                                    targetBtn.innerHTML = '☰';
                                    targetBtn.setAttribute('contenteditable', 'false');
                                    targetHeader.appendChild(targetBtn);
                                    modified = true;
                                }
                            }
                        }
                    });

                    if (modified) {
                        generatedFiles[filename] = "<!DOCTYPE html>\n" + parsedDoc.documentElement.outerHTML;
                    }
                }
            }
        }
    };
</script>

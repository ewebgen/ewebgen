<script>
    window.initEditor = function(iframe) {
        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
        if (!iframeDoc.body) { iframe.onload = () => window.initEditor(iframe); return; }
        
        // GOAL 1 FIX: Added .eweb-plus-btn-top and .eweb-plus-btn-bottom to stale controls so they don't get saved/stuck
        const staleControls = iframeDoc.querySelectorAll('.bg-control-container, .section-action-bar, .column-action-bar, .widget-action-bar, .bg-edit-btn, .eweb-drop-indicator, .eweb-video-overlay, .eweb-plus-btn-top, .eweb-plus-btn-bottom');
        staleControls.forEach(el => el.remove());

        if (typeof enableEditing === 'function') enableEditing(iframeDoc);
        
        iframeDoc.querySelectorAll('.carousel-control-prev, .carousel-control-next, .carousel-indicators').forEach(el => {
            el.setAttribute('contenteditable', 'false');
        });

        if (!iframeDoc.body.dataset.editorEventsBound) {
            iframeDoc.body.addEventListener('input', () => { 
                if(typeof typingTimer !== 'undefined') clearTimeout(typingTimer); 
                window.typingTimer = setTimeout(() => { if(typeof window.captureState === 'function') window.captureState(); }, 800); 
                if(typeof enableSaveButton === 'function') enableSaveButton(); 
            });
            
            iframeDoc.addEventListener('selectionchange', () => { 
                const sel = iframeDoc.getSelection(); 
                if (sel && sel.rangeCount > 0 && !sel.isCollapsed) window.lastValidRange = sel.getRangeAt(0).cloneRange(); 
            });

            iframeDoc.addEventListener('mouseup', () => { setTimeout(() => { if(typeof handleTextSelection === 'function') handleTextSelection(iframeDoc); }, 50); });

            iframeDoc.addEventListener('mousedown', (e) => {
                if(e.target.closest('.section-action-bar') || e.target.closest('.column-action-bar') || e.target.closest('.widget-action-bar') || e.target.closest('.bg-control-container')) return;
                const sel = iframeDoc.getSelection();
                if(!sel || sel.isCollapsed) {
                    const toolbar = document.getElementById('font-toolbar');
                    if(toolbar) {
                        toolbar.style.display = 'none';
                        toolbar.classList.remove('active');
                    }
                }
            });

            iframeDoc.body.addEventListener('keydown', (e) => {
                if (e.key === 'Delete' || e.key === 'Backspace') {
                    const sel = iframeDoc.getSelection();
                    if (!sel.rangeCount || !sel.isCollapsed) return;
                    const focusNode = sel.focusNode; let target = null;
                    if (focusNode) {
                        if(focusNode.nodeType === 1 && focusNode.classList.contains('image-wrapper-editable')) target = focusNode;
                        else if (focusNode.parentElement && focusNode.parentElement.classList.contains('image-wrapper-editable')) target = focusNode.parentElement;
                    }
                    if (target) { e.preventDefault(); if(typeof window.captureState === 'function') window.captureState(); target.remove(); if(typeof enableSaveButton === 'function') enableSaveButton(); if(typeof window.captureState === 'function') window.captureState(); if(typeof updateStatus === 'function') updateStatus("🗑️ Image deleted."); }
                }
            });
            
            iframeDoc.addEventListener('click', (e) => { 
                const carouselControl = e.target.closest('.carousel-control-prev, .carousel-control-next');
                if (carouselControl) {
                    e.preventDefault(); e.stopPropagation();
                    const carousel = carouselControl.closest('.carousel');
                    if (carousel) {
                        const activeItem = carousel.querySelector('.carousel-item.active');
                        if (activeItem) {
                            const items = Array.from(carousel.querySelectorAll('.carousel-item'));
                            const currentIndex = items.indexOf(activeItem);
                            const isNext = carouselControl.classList.contains('carousel-control-next');
                            let nextIndex = isNext ? currentIndex + 1 : currentIndex - 1;
                            if (nextIndex >= items.length) nextIndex = 0;
                            if (nextIndex < 0) nextIndex = items.length - 1;
                            activeItem.classList.remove('active');
                            items[nextIndex].classList.add('active');
                        }
                    }
                    return;
                }

                const indicator = e.target.closest('.carousel-indicators button, .carousel-indicators li');
                if (indicator) {
                    e.preventDefault(); e.stopPropagation();
                    const carousel = indicator.closest('.carousel');
                    if (carousel) {
                        const slideTo = indicator.getAttribute('data-bs-slide-to') || indicator.getAttribute('data-slide-to');
                        if (slideTo !== null) {
                            const items = Array.from(carousel.querySelectorAll('.carousel-item'));
                            const activeItem = carousel.querySelector('.carousel-item.active');
                            if (activeItem) activeItem.classList.remove('active');
                            if (items[slideTo]) items[slideTo].classList.add('active');
                            const activeInd = carousel.querySelector('.carousel-indicators .active');
                            if (activeInd) activeInd.classList.remove('active');
                            indicator.classList.add('active');
                        }
                    }
                    return;
                }
                
                const addWidgetBtn = e.target.closest('.inline-add-widget-btn, .add-section-btn, .left-add-plus-btn, .eweb-plus-btn-top, .eweb-plus-btn-bottom');
                
                if (addWidgetBtn) {
                    e.preventDefault();
                    e.stopPropagation();

                    const targetCol = addWidgetBtn.closest('.eweb-column, .col, .col-md-4, .col-md-6, .eweb-block, section, .eweb-section') || addWidgetBtn.parentElement;
                    
                    if (window.parent) window.parent.__insertTarget = targetCol;
                    window.__insertTarget = targetCol;

                    const addBtnSidebar = document.getElementById('sidebar-add-btn') || (window.parent && window.parent.document.getElementById('sidebar-add-btn'));
                    const elementsSlider = document.getElementById('elements-slider') || document.getElementById('ui-elements-slider') || (window.parent && (window.parent.document.getElementById('elements-slider') || window.parent.document.getElementById('ui-elements-slider')));
                    const overlay = document.getElementById('slider-overlay') || (window.parent && window.parent.document.getElementById('slider-overlay'));

                    if (typeof window.toggleUIElementsSlider === 'function') {
                        window.toggleUIElementsSlider();
                    } else if (window.parent && typeof window.parent.toggleUIElementsSlider === 'function') {
                        window.parent.toggleUIElementsSlider();
                    } else if (addBtnSidebar) {
                        addBtnSidebar.click();
                    } else if (elementsSlider) {
                        elementsSlider.classList.add('open');
                        if(overlay) overlay.style.display = 'block';
                    }
                    
                    if(typeof updateStatus === 'function') updateStatus("Select a widget to insert.");
                    return;
                }

                const cm = iframeDoc.getElementById('custom-context-menu'); 
                if(cm) cm.style.display = 'none'; 
                const parentProfileMenu = window.parent.document.getElementById('profile-menu');
                if(parentProfileMenu) parentProfileMenu.style.display = 'none';

                let target = e.target;
                if (target.closest('.bg-control-container') || target.closest('.section-action-bar') || target.closest('.column-action-bar') || target.closest('.widget-action-bar') || target.closest('.resize-handle') || target.classList.contains('bg-edit-btn') || target.classList.contains('action-btn')) { return; }

                if (target.nodeType === 3) target = target.parentNode;

                let exactText = target.innerText ? target.innerText.trim() : "";
                exactText = exactText.replace(/\s+/g, ' ');

                const tagName = target.tagName;
                const attributes = {};
                if(target.id) attributes.id = target.id;
                if(target.className) {
                    const cleanClass = target.className.replace(/section-hover|subsection-hover|image-wrapper-editable|eweb-column-hover/g, '').trim();
                    if(cleanClass) attributes.className = cleanClass;
                }
                if(target.getAttribute('src')) attributes.src = target.getAttribute('src');
                if(target.getAttribute('href')) attributes.href = target.getAttribute('href');

                const payload = { tagName: tagName, text: exactText.substring(0, 100), attributes: attributes, id: target.id || null, className: target.className || null };
                if (window.highlightCodeFromPreview) window.highlightCodeFromPreview(payload);
                else if (window.parent && window.parent.highlightCodeFromPreview) window.parent.highlightCodeFromPreview(payload);
            });

            iframe.contentWindow.highlightElementInPreview = function(data) {
                let target = null;
                if (data.id) target = iframeDoc.getElementById(data.id);
                if (!target && data.tagName) {
                    const elements = iframeDoc.getElementsByTagName(data.tagName);
                    if (elements.length > 0) target = elements[0];
                }
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    const origOutline = target.style.outline;
                    const origTransition = target.style.transition;
                    target.style.transition = 'outline 0.3s ease-out';
                    target.style.outline = '3px solid #ff4757';
                    setTimeout(() => { target.style.outline = origOutline; target.style.transition = origTransition; }, 1500);
                }
            };

            iframeDoc.addEventListener('contextmenu', (e) => { e.preventDefault(); if(typeof window.showContextMenu === 'function') window.showContextMenu(e, e.target, iframeDoc); });
            iframeDoc.body.dataset.editorEventsBound = 'true';
            
            iframeDoc.body.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
                
                iframeDoc.querySelectorAll('.eweb-drop-indicator').forEach(el => el.remove());
                iframeDoc.querySelectorAll('.eweb-drag-hover').forEach(el => el.classList.remove('eweb-drag-hover'));

                const target = e.target;
                
                let dropZone = null;
                if (target.closest('.eweb-column') || target.closest('.eweb-block')) {
                    dropZone = target.closest('.eweb-column') || target.closest('.eweb-block');
                    dropZone.classList.add('eweb-drag-hover');
                    
                    const indicator = iframeDoc.createElement('div');
                    indicator.className = 'eweb-drop-indicator';
                    
                    const widget = target.closest('.eweb-widget');
                    if (widget) {
                        const rect = widget.getBoundingClientRect();
                        if (e.clientY < rect.top + rect.height / 2) {
                            widget.parentNode.insertBefore(indicator, widget);
                        } else {
                            widget.parentNode.insertBefore(indicator, widget.nextSibling);
                        }
                    } else {
                        dropZone.appendChild(indicator);
                    }
                } else if (target.tagName === 'BODY' || target.closest('.eweb-section')) {
                    const section = target.closest('.eweb-section');
                    const indicator = iframeDoc.createElement('div');
                    indicator.className = 'eweb-drop-indicator';
                    indicator.style.height = '8px';
                    indicator.style.background = '#28a745';
                    
                    if (section) {
                        const rect = section.getBoundingClientRect();
                        if (e.clientY < rect.top + rect.height / 2) {
                            section.parentNode.insertBefore(indicator, section);
                        } else {
                            section.parentNode.insertBefore(indicator, section.nextSibling);
                        }
                    } else {
                        iframeDoc.body.appendChild(indicator);
                    }
                }
            });

            iframeDoc.body.addEventListener('dragleave', (e) => {
                if (e.target.classList && (e.target.classList.contains('eweb-column') || e.target.classList.contains('eweb-block'))) {
                    e.target.classList.remove('eweb-drag-hover');
                }
            });

            iframeDoc.body.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                
                const content = e.dataTransfer.getData('application/ewebgen-element');
                const type = e.dataTransfer.getData('application/ewebgen-type');
                if (!content) return;

                if(typeof window.captureState === 'function') window.captureState();

                const indicator = iframeDoc.querySelector('.eweb-drop-indicator');
                const tempDiv = iframeDoc.createElement('div');
                tempDiv.innerHTML = content;
                const elementToInsert = tempDiv.firstElementChild;

                if (indicator) {
                    indicator.parentNode.insertBefore(elementToInsert, indicator);
                    indicator.remove();
                } else {
                    const col = e.target.closest('.eweb-column') || e.target.closest('.eweb-block');
                    if (col && type === 'widget') {
                        col.appendChild(elementToInsert);
                        if(col.dataset.empty) { col.innerHTML = ''; col.removeAttribute('data-empty'); col.appendChild(elementToInsert); }
                    } else {
                        iframeDoc.body.appendChild(elementToInsert);
                    }
                }

                iframeDoc.querySelectorAll('.eweb-drag-hover').forEach(el => el.classList.remove('eweb-drag-hover'));
                
                if (typeof window.executeInjectedScripts === 'function') {
                    window.executeInjectedScripts(iframeDoc.body, iframeDoc);
                }
                
                if (typeof window.initEditor === 'function') window.initEditor(iframe); 
                if(document.getElementById('save-btn')) document.getElementById('save-btn').disabled = false;
                if(typeof window.captureState === 'function') window.captureState();
            });
        }

        if (typeof editorObserver !== 'undefined' && editorObserver) {
            editorObserver.disconnect();
        }

        window.editorObserver = new MutationObserver((mutations) => {
            if (typeof isRestoring !== 'undefined' && isRestoring) return; 
            
            let shouldCapture = false;
            mutations.forEach(m => {
                if (m.target && m.target.classList) {
                    if (m.target.classList.contains('bg-control-container') || 
                        m.target.classList.contains('section-action-bar') ||
                        m.target.classList.contains('column-action-bar') ||
                        m.target.classList.contains('widget-action-bar') ||
                        m.target.classList.contains('section-hover') ||
                        m.target.classList.contains('subsection-hover') ||
                        m.target.classList.contains('eweb-column-hover') ||
                        m.target.classList.contains('eweb-drop-indicator') ||
                        m.target.classList.contains('eweb-plus-btn-top') ||
                        m.target.classList.contains('eweb-plus-btn-bottom') ||
                        m.target.classList.contains('resize-handle')) {
                        return;
                    }
                }
                shouldCapture = true;
            });
            
            if (shouldCapture) {
                if(typeof typingTimer !== 'undefined') clearTimeout(typingTimer);
                window.typingTimer = setTimeout(() => { 
                    if(typeof window.captureState === 'function') window.captureState(); 
                }, 800); 
                if(typeof enableSaveButton === 'function') enableSaveButton();
            }
        });
        
        if (window.editorObserver) {
            window.editorObserver.observe(iframeDoc.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['style', 'src', 'href', 'class'] });
        }

        if (!iframeDoc.getElementById('editor-styles')) {
            const editorStyle = iframeDoc.createElement('style');
            editorStyle.id = 'editor-styles';
            editorStyle.textContent = `
                body { min-height: 100vh; padding-bottom: 100px; }
                .eweb-section, .eweb-block { position: relative; transition: outline 0.2s; border: 1px dashed rgba(204, 204, 204, 0.6); }
                .eweb-column { position: relative; transition: outline 0.2s; border: 1px dashed rgba(0, 123, 255, 0.5); min-height: 50px; }
                .eweb-column[data-empty="true"] { background: rgba(0, 123, 255, 0.03); }
                .eweb-widget { position: relative; transition: outline 0.2s; margin-bottom: 15px; }
                
                .eweb-section:hover, .eweb-block:hover { outline: 2px solid #28a745 !important; outline-offset: -2px; }
                .eweb-column:hover { outline: 2px dashed #007bff !important; outline-offset: -2px; }
                .eweb-widget:hover { outline: 2px solid #17a2b8 !important; outline-offset: 2px; }
                
                .section-action-bar { position: absolute; top: 0; right: 0; background: #28a745; border-radius: 0 0 0 5px; padding: 4px 8px; display: none; z-index: 9005; gap: 4px; pointer-events: auto; }
                .column-action-bar { position: absolute; top: 0; left: 0; background: #007bff; border-radius: 0 0 5px 0; padding: 2px 6px; display: none; z-index: 9006; gap: 4px; pointer-events: auto; }
                .widget-action-bar { position: absolute; top: -15px; right: 10px; background: #17a2b8; border-radius: 4px; padding: 2px 6px; display: none; z-index: 9007; gap: 4px; pointer-events: auto; }
                
                .eweb-section:hover > .section-action-bar, .eweb-block:hover > .section-action-bar { display: flex !important; }
                .eweb-column:hover > .column-action-bar { display: flex !important; }
                .eweb-widget:hover > .widget-action-bar { display: flex !important; }
                
                .action-btn { background: transparent; border: none; color: white; cursor: pointer; padding: 0 4px; font-size: 12px; }
                .action-btn:hover { transform: scale(1.1); }
                
                .eweb-drag-hover { background-color: rgba(0, 123, 255, 0.1) !important; outline: 2px dashed #007bff !important; }
                .eweb-drop-indicator { height: 4px; background: #007bff; margin: 5px 0; border-radius: 2px; pointer-events: none; transition: all 0.2s; }
                
                .left-add-plus-btn { position: absolute; left: 0; top: 50%; transform: translateY(-50%) translateX(-50%); width: 24px; height: 24px; background: #007bff; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; z-index: 9008; opacity: 0; transition: opacity 0.2s; pointer-events: auto; }
                .eweb-section:hover > .left-add-plus-btn, .eweb-block:hover > .left-add-plus-btn { opacity: 1; }

                .eweb-section, .eweb-row, .eweb-column, .eweb-block { cursor: default; }

                .bg-control-container { position: absolute; top: 0; left: 0; display: none; gap: 5px; z-index: 9000; pointer-events: auto; background: rgba(0,0,0,0.6); padding: 4px; border-radius: 0 0 5px 0;}
                section:hover > .bg-control-container, header:hover > .bg-control-container, footer:hover > .bg-control-container, div.card:hover > .bg-control-container, div.col:hover > .bg-control-container, .section-hover > .bg-control-container, .subsection-hover > .bg-control-container { display: flex !important; }
                .bg-edit-btn { background: transparent; color: white; border: none; padding: 2px; cursor: pointer; font-size: 14px; transition: transform 0.1s; }
                .bg-edit-btn:hover { transform: scale(1.1); }
                .image-wrapper-editable { display: inline-block; position: relative; transition: outline 0.2s; }
                .image-wrapper-editable:hover { outline: 2px dashed #007bff; }
                .resize-handle { width: 12px; height: 12px; background: #007bff; border: 1px solid white; position: absolute; bottom: -6px; right: -6px; cursor: se-resize; z-index: 10010; display: none; border-radius: 50%; }
                .image-wrapper-editable:hover .resize-handle { display: block; }
                #custom-context-menu { position: fixed; background: white; border: 1px solid #ccc; box-shadow: 2px 2px 10px rgba(0,0,0,0.2); z-index: 2147483647; display: none; flex-direction: column; min-width: 180px; border-radius: 5px; overflow: hidden; font-family: sans-serif; }
                #custom-context-menu button { background: white; border: none; text-align: left; padding: 8px 15px; cursor: pointer; font-size: 14px; border-bottom: 1px solid #eee; color: #333; display: flex; align-items: center; gap: 8px; width: 100%; transition: background 0.1s; }
                #custom-context-menu button:hover { background: #f0f0f0; }
                #custom-context-menu .menu-header { font-size: 11px; text-transform: uppercase; color: #777; padding: 5px 10px; background: #f9f9f9; font-weight: bold; cursor: default; }
            `;
            iframeDoc.head.appendChild(editorStyle);
        }

        iframeDoc.querySelectorAll('img').forEach(img => {
            if (img.closest('.carousel')) return;
            const computedStyle = iframe.contentWindow.getComputedStyle(img);
            if (computedStyle.position === 'absolute' || computedStyle.position === 'fixed') return;
            if (computedStyle.width === '100%' || computedStyle.width === '100vw') return;
            
            let wrapper = img.closest('.image-wrapper-editable');
            if (!wrapper) {
                wrapper = iframeDoc.createElement('div'); wrapper.className = 'image-wrapper-editable'; wrapper.style.position = 'relative'; wrapper.style.display = 'inline-block'; wrapper.style.lineHeight = '0'; 
                img.parentNode.insertBefore(wrapper, img); wrapper.appendChild(img);
            }
            wrapper.contentEditable = 'false';
            if (!wrapper.querySelector('.resize-handle')) {
                const resizeHandle = iframeDoc.createElement('div'); resizeHandle.className = 'resize-handle'; wrapper.appendChild(resizeHandle);
                if(typeof window.makeImageResizable === 'function') window.makeImageResizable(img, resizeHandle, wrapper, iframeDoc);
            }
        });

        const bindActionBar = (element, type, className, html, bgColor) => {
            if(element.querySelector(`.${className}`)) return;
            const bar = iframeDoc.createElement('div');
            bar.className = className;
            bar.contentEditable = 'false';
            bar.innerHTML = html;
            element.insertBefore(bar, element.firstChild);

            const delBtn = bar.querySelector('.del-btn');
            if (delBtn) delBtn.onclick = (e) => { e.stopPropagation(); if(typeof window.captureState === 'function') window.captureState(); element.remove(); if(typeof window.enableSaveButton === 'function') window.enableSaveButton(); };
            
            const dupBtn = bar.querySelector('.dup-btn');
            if (dupBtn) dupBtn.onclick = (e) => { e.stopPropagation(); if(typeof window.captureState === 'function') window.captureState(); const clone = element.cloneNode(true); clone.querySelectorAll(`.${className}`).forEach(c => c.remove()); element.parentNode.insertBefore(clone, element.nextSibling); initEditor(iframe); if(typeof window.enableSaveButton === 'function') window.enableSaveButton(); };
            
            const setBtn = bar.querySelector('.set-btn');
            if (setBtn) setBtn.onclick = (e) => { 
                e.stopPropagation(); 
                if(typeof window.captureState === 'function') window.captureState(); window.currentBgElementToReplace = element; 
                let bgInput = document.getElementById('dynamic-bg-color-picker');
                if(!bgInput) {
                    bgInput = document.createElement('input'); bgInput.type = 'color'; bgInput.id = 'dynamic-bg-color-picker'; bgInput.style.position = 'absolute'; bgInput.style.opacity = '0'; bgInput.style.pointerEvents = 'none'; document.body.appendChild(bgInput);
                    bgInput.addEventListener('input', (ev) => { if (window.currentBgElementToReplace) window.currentBgElementToReplace.style.backgroundColor = ev.target.value; });
                    bgInput.addEventListener('change', (ev) => { if (window.currentBgElementToReplace) { window.currentBgElementToReplace.style.backgroundColor = ev.target.value; if(typeof window.updateStatus === 'function') window.updateStatus('Background color updated.'); if(typeof window.enableSaveButton === 'function') window.enableSaveButton(); if(typeof window.captureState === 'function') window.captureState(); window.currentBgElementToReplace = null; } });
                }
                const currentBg = window.getComputedStyle(element).backgroundColor;
                if (currentBg && currentBg.startsWith('rgb')) bgInput.value = rgb2hex(currentBg);
                try { bgInput.showPicker(); } catch(ex) { bgInput.click(); }
            };

            const saveSecBtn = bar.querySelector('.save-sec-btn');
            if (saveSecBtn) saveSecBtn.onclick = (e) => {
                e.stopPropagation();
                if(typeof window.openSaveSectionModal === 'function') window.openSaveSectionModal(element);
            };

            const editVidBtn = bar.querySelector('.edit-vid-btn');
            if (editVidBtn) {
                editVidBtn.onclick = (e) => {
                    e.stopPropagation();
                    const targetVid = element.querySelector('video, iframe') || element;
                    if (targetVid) {
                        const isYouTube = targetVid.tagName === 'IFRAME';
                        if (typeof window.parent.openEditVideoModal === 'function') {
                            window.parent.openEditVideoModal(element, targetVid.src, isYouTube);
                        } else if (typeof openEditVideoModal === 'function') {
                            openEditVideoModal(element, targetVid.src, isYouTube);
                        } else {
                            const newUrl = prompt("Enter new Video URL:", targetVid.src);
                            if (newUrl) {
                                targetVid.src = newUrl;
                                if(typeof window.captureState === 'function') window.captureState();
                                if(typeof enableSaveButton === 'function') enableSaveButton();
                            }
                        }
                    }
                };
            }
        };

        iframeDoc.querySelectorAll('.eweb-section, .eweb-block').forEach(sec => {
            sec.contentEditable = 'false';
            bindActionBar(sec, 'section', 'section-action-bar', `<span style="font-size:10px; font-weight:bold; margin-right:5px;">SECTION</span> <button class="action-btn save-sec-btn" title="Save Section">💾</button> <button class="action-btn set-btn" title="Background Color">🎨</button> <button class="action-btn dup-btn" title="Duplicate">📋</button> <button class="action-btn del-btn" title="Delete">❌</button>`, '#28a745');
            
            if(!sec.querySelector('.left-add-plus-btn')) {
                const plusBtn = iframeDoc.createElement('div');
                plusBtn.className = 'left-add-plus-btn';
                plusBtn.innerHTML = '+';
                plusBtn.contentEditable = 'false';
                plusBtn.title = 'Add Element or Section';
                plusBtn.onclick = (e) => {
                    e.stopPropagation();
                    if(typeof window.openSectionPlusPopup === 'function') {
                        const rect = plusBtn.getBoundingClientRect();
                        const iframeRect = iframe.getBoundingClientRect();
                        const x = iframeRect.left + rect.left + rect.width;
                        const y = iframeRect.top + rect.top;
                        window.openSectionPlusPopup(sec, x, y);
                    }
                };
                sec.appendChild(plusBtn);
            }
        });

        iframeDoc.querySelectorAll('.eweb-column').forEach(col => {
            col.contentEditable = 'false';
            bindActionBar(col, 'column', 'column-action-bar', `<span style="font-size:10px; font-weight:bold; margin-right:5px;">COL</span> <button class="action-btn set-btn" title="Background Color">🎨</button> <button class="action-btn del-btn" title="Delete">❌</button>`, '#007bff');
        });

         

    // ==========================================
    // GRADIENT POPUP LOGIC (NEW)
    // ==========================================
    window.showGradientPopup = function(targetElement) {
        let popup = document.getElementById('gradient-popup-modal');
        if (!popup) {
            popup = document.createElement('div');
            popup.id = 'gradient-popup-modal';
            popup.style.cssText = 'position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#fff; padding:20px; border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,0.3); z-index:100000; width:300px; display:flex; flex-direction:column; gap:15px; font-family:sans-serif;';
            
            popup.innerHTML = `
                <h4 style="margin:0; color:#333;">Set Gradient Background</h4>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <label style="font-size:14px; color:#555;">Color 1:</label>
                    <input type="color" id="grad-color-1" value="#007bff" style="width:50px; height:30px; border:none; cursor:pointer;">
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <label style="font-size:14px; color:#555;">Color 2:</label>
                    <input type="color" id="grad-color-2" value="#00c6ff" style="width:50px; height:30px; border:none; cursor:pointer;">
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <label style="font-size:14px; color:#555;">Direction:</label>
                    <select id="grad-direction" style="padding:5px; border-radius:4px; border:1px solid #ccc; width:120px;">
                        <option value="to right">Right</option>
                        <option value="to left">Left</option>
                        <option value="to bottom">Bottom</option>
                        <option value="to top">Top</option>
                        <option value="to bottom right">Bottom Right</option>
                        <option value="135deg">135 Degrees</option>
                        <option value="45deg">45 Degrees</option>
                    </select>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:10px;">
                    <button id="grad-cancel" style="padding:8px 12px; border:none; background:#ccc; border-radius:4px; cursor:pointer; color:#333;">Cancel</button>
                    <button id="grad-apply" style="padding:8px 12px; border:none; background:#28a745; color:#fff; border-radius:4px; cursor:pointer;">Apply</button>
                </div>
            `;
            document.body.appendChild(popup);
            
            document.getElementById('grad-cancel').onclick = () => {
                popup.style.display = 'none';
                window.currentBgElementToReplace = null;
            };
            
            document.getElementById('grad-apply').onclick = () => {
                const c1 = document.getElementById('grad-color-1').value;
                const c2 = document.getElementById('grad-color-2').value;
                const dir = document.getElementById('grad-direction').value;
                
                if (window.currentBgElementToReplace) {
                    if(typeof window.captureState === 'function') window.captureState();
                    
                    // FIX: Ensure the background-image overrides bootstrap classes and colors
                    window.currentBgElementToReplace.style.setProperty('background-image', `linear-gradient(${dir}, ${c1}, ${c2})`, 'important');
                    window.currentBgElementToReplace.style.setProperty('background-color', 'transparent', 'important');
                    
                    // Automatically strip conflicting Bootstrap background classes
                    const bgClasses = Array.from(window.currentBgElementToReplace.classList).filter(c => c.startsWith('bg-'));
                    if(bgClasses.length > 0) window.currentBgElementToReplace.classList.remove(...bgClasses);
                    
                    if(typeof enableSaveButton === 'function') enableSaveButton();
                    if(typeof window.captureState === 'function') window.captureState();
                    if(typeof updateStatus === 'function') updateStatus("✅ Gradient background applied.");
                }
                popup.style.display = 'none';
                window.currentBgElementToReplace = null;
            };
        }
        
        window.currentBgElementToReplace = targetElement;
        popup.style.display = 'flex';
    };

    // ========================================================
    // GOAL 1 FIX: FORCE SAVE AS ON UNSAVED PROJECTS
    // ========================================================
    window.saveContent = function() {
        if (typeof isVoiceActive !== 'undefined' && isVoiceActive) {
            const btn = document.getElementById('voice-edit-btn');
            if (btn && typeof toggleVoiceEdit === 'function') toggleVoiceEdit(btn);
        }
        
        const iframe = document.getElementById('preview-frame');
        const doc = iframe.contentDocument || iframe.contentWindow.document;

        let newBody = "";
        
        if (typeof window.getCleanFullContent === 'function') {
            newBody = window.getCleanFullContent(doc);
        } else {
            const clone = doc.body.cloneNode(true);
            clone.querySelectorAll('.bg-control-container, .bg-edit-btn, .image-overlay-controls, .resize-handle, .section-action-bar').forEach(c => c.remove());
            newBody = clone.innerHTML;
        }

        if(typeof window.currentPreviewFile !== 'undefined' && window.currentPreviewFile) {
            if (typeof window.generatedFiles !== 'undefined') {
                window.generatedFiles[window.currentPreviewFile] = newBody;
            }
        }

        const session = typeof getLocalSession === 'function' ? getLocalSession() : (JSON.parse(localStorage.getItem('ai_web_builder_session')) || {});
        
        if (!session.activeProject && !session.active_project) {
            // Workspace exists but hasn't been named/saved yet.
            if (typeof updateStatus === 'function') updateStatus("Please name your project first...");
            if (typeof saveProject === 'function') {
                saveProject(true); // Trigger the "Save As" flow
            }
            return; // Stop the single file save. saveProject() will upload the entire workspace JSON.
        }

        if (typeof updateStatus === 'function') updateStatus(`Saving ${window.currentPreviewFile}...`);

        const saveBtn = document.getElementById('save-btn');
        if (saveBtn) {
            saveBtn.textContent = "Saving...";
            saveBtn.disabled = true;
        }

        fetch('/save', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: window.currentPreviewFile, new_body_content: newBody })
        }).then(response => response.json()).then(data => {
            if (data.success) {
                if (typeof updateStatus === 'function') updateStatus(`Saved ${window.currentPreviewFile}.`);
                if (saveBtn) {
                    saveBtn.textContent = "Saved";
                    saveBtn.disabled = true; 
                }
                if (data.saved_content) { 
                    if (typeof window.isRestoring !== 'undefined') window.isRestoring = true;
                    if(typeof window.initEditor === 'function') window.initEditor(iframe); 
                    setTimeout(() => { if (typeof window.isRestoring !== 'undefined') window.isRestoring = false; }, 300);
                }
            } else { 
                if (typeof updateStatus === 'function') updateStatus(`Save Failed: ${data.error}`, true); 
                if (typeof enableSaveButton === 'function') enableSaveButton();
            }
        }).catch(err => {
            if (typeof updateStatus === 'function') updateStatus(`Save Error: ${err.message}`, true);
            if (typeof enableSaveButton === 'function') enableSaveButton();
        });
    }

</script>
